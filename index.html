<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Entrega de Turno SAMU</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#262f7c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entrega SAMU">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Colores institucionales SAMU Magallanes: azul y amarillo del escudo. Layout: barra superior fija con folio y acciones · índice de secciones (lateral en pantallas anchas, fila deslizable en tablet) · resumen de estado arriba · una tarjeta por bloque del formulario en papel */
:root{
  --bg:#f1f3f8; --surface:#ffffff; --surface-2:#e8ebf4; --field:#fbfcfe;
  --ink:#151a33; --ink-2:#414964; --ink-3:#666e88; --line:#d2d7e6; --line-2:#e3e6f0;
  --accent:#2a3489; --accent-ink:#ffffff; --accent-soft:#e0e4f6;
  --brand:#262f7c; --brand-y:#ede914; --on-brand:#ffffff; --on-y:#1f2766;
  --good:#0ca30c; --good-ink:#176d28; --good-soft:#e0f1e1;
  --warn:#fab219; --warn-ink:#7d4f00; --warn-soft:#fcefd2;
  --crit:#d03b3b; --crit-ink:#a3242a; --crit-soft:#fae2e1;
  --info-ink:#1c5cab; --info-soft:#e2edfa;
  --series:#2a78d6; --band:rgba(12,163,12,.10);
  --on-status:#ffffff; --on-warn:#1d1400; --scrim:rgba(12,16,40,.5);
  --f-display:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f1e; --surface:#141a30; --surface-2:#1d2440; --field:#0f1428;
    --ink:#e6e9f5; --ink-2:#b3b9d0; --ink-3:#8a91ab; --line:#2d3453; --line-2:#232a46;
    --accent:#a3b0ff; --accent-ink:#0c1238; --accent-soft:#1f2856;
    --brand:#1a2158;
    --good-ink:#7fd68f; --good-soft:#163020;
    --warn-ink:#f5c45a; --warn-soft:#382b0f;
    --crit-ink:#ff8f8a; --crit-soft:#3b1a1a;
    --info-ink:#8ab8f0; --info-soft:#16273b;
    --series:#3987e5; --band:rgba(12,163,12,.16); --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f1e; --surface:#141a30; --surface-2:#1d2440; --field:#0f1428;
  --ink:#e6e9f5; --ink-2:#b3b9d0; --ink-3:#8a91ab; --line:#2d3453; --line-2:#232a46;
  --accent:#a3b0ff; --accent-ink:#0c1238; --accent-soft:#1f2856;
  --brand:#1a2158;
  --good-ink:#7fd68f; --good-soft:#163020;
  --warn-ink:#f5c45a; --warn-soft:#382b0f;
  --crit-ink:#ff8f8a; --crit-soft:#3b1a1a;
  --info-ink:#8ab8f0; --info-soft:#16273b;
  --series:#3987e5; --band:rgba(12,163,12,.16); --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{width:100%}body{min-height:100vh;min-height:100dvh}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-brand);border-bottom:4px solid var(--brand-y)}
.top :focus-visible{outline-color:var(--brand-y)}
.top .btn{background:transparent;color:var(--on-brand);border-color:rgba(255,255,255,.35)}
.top .btn:hover{background:rgba(255,255,255,.1)}
.top .btn.primary{background:var(--brand-y);border-color:var(--brand-y);color:var(--on-y)}
.top .btn.primary:hover{filter:brightness(1.05)}
.secnav-h .nav-i{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.88)}
.secnav-h .nav-i:hover{color:var(--on-brand)}
.secnav-h .nav-i.on{background:var(--brand-y);border-color:transparent;color:var(--on-y)}
.secnav-h .dot{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.65)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:none;width:100%;margin:0;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
@media (max-width:1099px){.top-meta{order:3;flex-basis:100%;padding-left:61px}h1 span{display:none}}
@media (max-width:640px){.top-meta{padding-left:0}h1 span{display:none}}
.brand img{height:52px;width:auto;flex:none;filter:drop-shadow(0 0 1px rgba(255,255,255,.6))}
.eyebrow{font:600 12px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-y)}
h1{margin:0;font:700 22px/1.1 var(--f-display);text-wrap:balance}
h1 span{font-weight:500;color:rgba(255,255,255,.75)}
.top-meta{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.folio{font:700 20px/1 var(--f-display);letter-spacing:.06em;color:var(--brand-y)}
.mode{font:600 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--on-brand)}
.mode.ro{background:var(--brand-y);color:var(--on-y)}
.savestate{font-size:13px;color:rgba(255,255,255,.72)}
.savestate[data-state="fail"]{color:#ffd3cf;font-weight:600}
.top-act{display:flex;gap:8px;flex-wrap:wrap}
.secnav-h{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:none;width:100%;margin:0;padding-block:0 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.secnav-h::-webkit-scrollbar{display:none}

/* ---------- botones ---------- */
.btn{font:600 15px/1 var(--f-body);min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;font-size:14px;padding:0 12px}
.btn.lg{min-height:52px;font-size:17px;padding:0 24px}
.btn.danger{color:var(--crit-ink);border-color:var(--crit)}
.btn.armed{background:var(--crit);border-color:var(--crit);color:var(--on-status)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--info-ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ---------- índice de secciones ---------- */
.nav-i{flex:none;display:flex;align-items:center;gap:9px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 14px/1.2 var(--f-body);color:var(--ink-2);cursor:pointer;text-align:left}
.nav-i:hover{color:var(--ink)}
.nav-i.on{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
[data-st="done"] > .dot{background:var(--good);box-shadow:none}
[data-st="todo"] > .dot{background:var(--warn);box-shadow:none}
[data-st="crit"] > .dot{background:var(--crit);box-shadow:none}
.secnav-v{display:none}

/* ---------- estructura ---------- */
.shell{max-width:none;width:100%;box-sizing:border-box;margin:0;padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1100px){
  .secnav-h{display:none}
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px}
  .secnav-v{display:flex;flex-direction:column;gap:3px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);align-self:start;max-height:calc(100vh - 110px);overflow:auto}
  .secnav-v .nav-i{border-color:transparent;background:transparent;border-radius:8px;min-height:38px}
  .secnav-v .nav-i.on{background:var(--accent-soft)}
  .secnav-v .navlbl{font:600 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:4px 12px 8px}
}

/* ---------- avisos superiores ---------- */
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:var(--r);background:var(--info-soft);color:var(--ink)}
.banner.ro{background:var(--warn-soft)}
.banner p{margin:0;min-width:0;flex:1 1 320px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- resumen ---------- */
.overview{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:920px){.overview{grid-template-columns:minmax(0,1fr)}}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip.link{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.chip.link:hover{border-color:var(--accent)}
.chip.link .go{font-size:13px;color:var(--info-ink);font-weight:600}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.chip .k{font:600 12px/1.2 var(--f-display);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.chip .v{font:700 28px/1.05 var(--f-display)}
.chip .v small{font-size:16px;font-weight:600;color:var(--ink-2)}
.chip .s{font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.chip[data-st="crit"]{border-color:var(--crit)}
.chip[data-st="crit"] .s{color:var(--crit-ink);font-weight:600}
.chip[data-st="warn"]{border-color:var(--warn)}
.chip[data-st="warn"] .s{color:var(--warn-ink);font-weight:600}
.chip[data-st="good"] .s{color:var(--good-ink);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.lastline{grid-column:1/-1;font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.alertbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 6px}
.alertbox h2{margin:0 0 4px;font:700 17px/1.2 var(--f-display);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.alertbox h2 span{font:500 13px var(--f-body);color:var(--ink-3)}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border:0;border-top:1px solid var(--line-2);width:100%;background:none;text-align:left;cursor:pointer;font-size:15px;line-height:1.35;color:var(--ink)}
.al:first-of-type{border-top:0}
.al:hover .tx{text-decoration:underline;text-underline-offset:2px}
.ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--f-display);margin-top:-1px}
.crit > .ic{background:var(--crit);color:var(--on-status)}
.warn > .ic{background:var(--warn);color:var(--on-warn)}
.info > .ic{background:var(--info-soft);color:var(--info-ink)}
.none{padding:10px 0 12px;color:var(--ink-3);font-size:15px}
.alertlist{max-height:330px;overflow:auto}

/* ---------- tarjetas de sección ---------- */
fieldset#fs{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:150px;min-width:0}
@media (min-width:1100px){.sec{scroll-margin-top:96px}}
.sec-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 18px 12px;border-bottom:1px solid var(--line-2)}
.sec-h h2{margin:0;font:700 21px/1.15 var(--f-display);letter-spacing:.01em;color:var(--accent)}
.sub{margin:3px 0 0;color:var(--ink-3);font-size:14px}
.sec-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pill{flex:none;font:600 12.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good-ink)}
.pill.todo{background:var(--warn-soft);color:var(--warn-ink)}
.pill.opt{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3)}
.subh{margin:4px 0 0;font:700 16px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.subh span{font:500 14px var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink-3)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.duo{grid-template-columns:minmax(0,1fr)}}
.duo > .sec{margin:0}

/* ---------- campos ---------- */
.grid{display:grid;gap:14px 16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tinfo{margin:12px 0 0;font-size:13.5px;color:var(--ink-3)}.tinfo b{color:var(--ink-2)}
.g-turno{grid-template-columns:auto minmax(190px,1fr) minmax(170px,1fr) minmax(170px,1fr) minmax(170px,1fr)}
@media (max-width:1250px){.g-turno{grid-template-columns:auto minmax(190px,1fr) minmax(170px,1fr)}}
@media (max-width:900px){.g-turno{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g-turno{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font:600 13px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
:where(input[type="text"],input[type="password"],input[type="search"],input[type="datetime-local"],input[type="number"],textarea){font:500 16px/1.3 var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:88px}
:where(input,textarea):focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
::placeholder{color:var(--ink-3);opacity:1}
fieldset:disabled :where(input,textarea,select){background:transparent;border-style:dashed}
select{font:500 16px/1.3 var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:8px 10px;width:100%;min-width:0}
select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.with-btn{display:flex;gap:8px}
.with-btn input{flex:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;background:var(--surface-2);width:max-content;max-width:100%;flex:none}
.seg button{min-width:64px;min-height:40px;border:0;border-radius:6px;background:transparent;font:700 15px/1 var(--f-display);letter-spacing:.06em;color:var(--ink-2);cursor:pointer;padding:0 14px}
.seg button:hover{background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.seg button.good{background:var(--good-soft);color:var(--good-ink);box-shadow:inset 0 0 0 1.5px var(--good)}
.seg button.bad{background:var(--crit);color:#fff;box-shadow:none}
.seg button.good{background:var(--good-ink);color:#fff;box-shadow:none}
.seg button.neu{background:var(--accent);color:var(--accent-ink);box-shadow:none}
/* ---------- colores por grupo de secciones ---------- */
:root{
--g1:#2f62d8; --g1t:#1f47a8; --g1s:rgba(47,98,216,.08);
--g2:#1f9d55; --g2t:#167a41; --g2s:rgba(31,157,85,.08);
--g3:#0e9bb8; --g3t:#0a7088; --g3s:rgba(14,155,184,.08);
--g4:#7c4dce; --g4t:#5f35aa; --g4s:rgba(124,77,206,.08);
--g5:#e0a100; --g5t:#8a6200; --g5s:rgba(224,161,0,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g1t:#8fb0ff;--g2t:#7fd6a2;--g3t:#7fd3e6;--g4t:#c3a6f5;--g5t:#f2cc6b;--g1s:rgba(47,98,216,.16);--g2s:rgba(31,157,85,.16);--g3s:rgba(14,155,184,.16);--g4s:rgba(124,77,206,.18);--g5s:rgba(224,161,0,.16)}}
:root[data-theme="dark"]{--g1t:#8fb0ff;--g2t:#7fd6a2;--g3t:#7fd3e6;--g4t:#c3a6f5;--g5t:#f2cc6b;--g1s:rgba(47,98,216,.16);--g2s:rgba(31,157,85,.16);--g3s:rgba(14,155,184,.16);--g4s:rgba(124,77,206,.18);--g5s:rgba(224,161,0,.16)}
[data-g="1"]{--gc:var(--g1);--gt:var(--g1t);--gs:var(--g1s)}
[data-g="2"]{--gc:var(--g2);--gt:var(--g2t);--gs:var(--g2s)}
[data-g="3"]{--gc:var(--g3);--gt:var(--g3t);--gs:var(--g3s)}
[data-g="4"]{--gc:var(--g4);--gt:var(--g4t);--gs:var(--g4s)}
[data-g="5"]{--gc:var(--g5);--gt:var(--g5t);--gs:var(--g5s)}
.sec[data-g]{border-top:5px solid var(--gc)}
.sec[data-g] > .sec-h{background:var(--gs);border-radius:max(0px,calc(var(--r) - 5px)) max(0px,calc(var(--r) - 5px)) 0 0}
.sec:has(.cbx.open){position:relative;z-index:40}
.sec[data-g] > .sec-h h2{color:var(--gt)}
.grp-h{display:flex;align-items:center;gap:12px;margin:18px 0 -2px;font:700 15px/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--gt)}
.grp-h:first-child{margin-top:0}
.grp-h b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-size:16px;letter-spacing:0}
.grp-h::after{content:"";flex:1;height:2px;border-radius:2px;background:var(--gc);opacity:.35}
.navgrp{display:flex;flex-direction:column;gap:1px;margin-bottom:6px}
.secnav-v .navgrp .nav-i{min-height:32px}
.secnav-v .navgrp .navlbl{display:flex;align-items:center;gap:8px;color:var(--gt);padding:6px 12px 6px}
.navgrp .navlbl b{width:20px;height:20px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-size:12px;letter-spacing:0}
.secnav-v .nav-i[data-g]{border-left:3px solid transparent;border-radius:0 8px 8px 0}
.secnav-v .nav-i[data-g]:hover{border-left-color:var(--gc)}
.secnav-v .nav-i[data-g].on{background:var(--gs);border-left-color:var(--gc)}
.secnav-h .nav-i[data-g]{box-shadow:inset 0 -3px 0 var(--gc)}
/* resumen de arriba con color según estado */
.chip[data-st="good"]{background:var(--good-soft);border-color:var(--good)}
.chip[data-st="warn"]{background:var(--warn-soft)}
.chip[data-st="crit"]{background:var(--crit-soft)}
.chip[data-st="good"] .v{color:var(--good-ink)}.chip[data-st="warn"] .v{color:var(--warn-ink)}.chip[data-st="crit"] .v{color:var(--crit-ink)}

.seg button.neu{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.yn{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line-2)}
.yn .q{font:500 16px/1.3 var(--f-body);min-width:0;flex:1 1 180px}
.ynlist{display:flex;flex-direction:column}
.ynblock{display:flex;flex-direction:column;gap:10px;padding-bottom:6px;border-bottom:1px dashed var(--line-2)}
.ynblock .yn{border-bottom:0}
.cond{padding:2px 0 6px 14px;border-left:3px solid var(--accent-soft);display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.step{display:inline-flex;align-self:flex-start;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--field);flex:none}
.step button{width:42px;min-height:44px;border:0;background:var(--surface-2);color:var(--ink);font:600 20px/1 var(--f-body);cursor:pointer}
.step button:hover{background:var(--line-2)}
.step input{width:56px;min-height:44px;border:0;border-radius:0;text-align:center;font:700 19px/1 var(--f-display);padding:0;background:transparent;color:var(--ink)}
.step input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
fieldset:disabled .step button{visibility:hidden}

.chk{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}

/* móviles */
.g-mov{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:1380px){.g-mov{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.g-mov{grid-template-columns:minmax(0,1fr)}}
.mv{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mv-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mv-h strong{font:700 19px/1 var(--f-display);letter-spacing:.02em}
.mv-st{font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.mv[data-st="done"]{border-color:var(--good)}
.mv[data-st="done"] .mv-st{background:var(--good-soft);color:var(--good-ink)}
.mv[data-st="part"]{border-color:var(--warn)}
.mv[data-st="part"] .mv-st{background:var(--warn-soft);color:var(--warn-ink)}
.crew{display:grid;grid-template-columns:40px minmax(0,1fr) 30px;align-items:center;gap:5px}
.crew .cbx input{padding-left:9px;padding-right:34px}
.crew .cbx-clr{display:none}
.crewfull{grid-column:2/-1;font:600 13px/1.3 var(--f-body);color:var(--accent);margin:-2px 0 2px 2px}
.crew .cbx-btn{width:30px;right:2px}
.splitbtn{width:30px;height:36px;border-radius:8px;border:1px dashed var(--line);background:transparent;color:var(--ink-3);font:700 15px/1 var(--f-display);cursor:pointer;padding:0}
.splitbtn:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.splitbtn.on{border-style:solid;font-size:20px;font-weight:400}
.splitbtn.on:hover{border-color:var(--crit);color:var(--crit-ink)}
.splitbtn.armed{width:auto;padding:0 6px;font-size:12px}
fieldset:disabled .splitbtn{visibility:hidden}
.crewsplit{display:flex;flex-direction:column;gap:4px;padding:6px;margin:0 -6px;border-radius:9px;background:var(--accent-soft)}
.role.two{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0}
.role.two small{font:600 10.5px/1 var(--f-display);letter-spacing:0;color:var(--ink-3)}
.splith{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding-left:45px}
.splith select{width:auto;min-height:32px;padding:2px 6px;font-size:14px}
.role{font:700 15px/1 var(--f-display);text-align:center;border-radius:7px;background:var(--surface-2);color:var(--ink-2);padding:15px 0;letter-spacing:.04em}

/* radios a cargo de cada móvil */
.mv-h{flex-wrap:wrap}
.rin{display:flex;align-items:center;gap:6px;margin-left:auto}
.rin .rlbl{font:600 12px/1 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.rin input{width:54px;min-height:42px;text-align:center;font:700 18px/1 var(--f-display);padding:4px}
.rin input.dup{border-color:var(--warn);background:var(--warn-soft)}
.lblrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mvradios{display:flex;flex-direction:column;gap:6px;padding-top:4px;border-top:1px dashed var(--line-2)}
.mvradios .rsel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mvradios select{min-height:44px;padding:6px 8px;font-weight:600}
.mvradios select.dup{border-color:var(--warn);background:var(--warn-soft)}
.radmov{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.rm{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line-2)}
.rm:first-child{border-top:0}
.rm b{font:700 16px/1.2 var(--f-display)}
.rm.free{background:var(--surface-2)}
.rm.free b{font-weight:600;color:var(--ink-2)}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{min-width:34px;text-align:center;font:700 14px/1 var(--f-display);padding:7px 8px;border-radius:7px;background:var(--accent-soft);color:var(--ink)}
.rchip.dup{background:var(--warn-soft);color:var(--warn-ink);box-shadow:inset 0 0 0 1.5px var(--warn)}
.rchip.off{background:var(--surface);color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:520px){.rm{grid-template-columns:minmax(0,1fr)}}
/* radios */
.rt{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(90px,1fr) auto 44px;gap:8px;align-items:center}
.rhead{font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.xbtn{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink-3);font-size:22px;line-height:1;cursor:pointer}
.xbtn:hover{color:var(--crit-ink);border-color:var(--crit)}
fieldset:disabled .xbtn{visibility:hidden}
.crow{display:grid;grid-template-columns:minmax(110px,1fr) minmax(0,2.2fr) auto 44px;gap:8px;align-items:center}
.crow .chk{white-space:nowrap}
@media (max-width:560px){.crow{grid-template-columns:minmax(0,1fr) 44px}.crow > .cbx{grid-column:1/2;grid-row:2}.crow .chk{grid-column:1/3;min-height:32px}.crow .xbtn{grid-row:1;grid-column:2}.crow.rhead{display:none}}
@media (max-width:560px){.rrow{grid-template-columns:minmax(0,1fr) 84px 44px}.rrow .chk{grid-column:1/3;min-height:32px}.rrow .xbtn{grid-row:1;grid-column:3}.rhead{display:none}}

/* equipos */
.g-eq{display:grid;gap:8px 12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.etile{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 6px 12px;border:1px solid var(--line-2);border-radius:8px;min-width:0}
.etile span{min-width:0}
.resgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.resrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 4px 12px;border:1px solid var(--line-2);border-radius:8px;min-width:0}
.resrow.rhead{font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.resrow select.rsel{font-weight:600;width:auto;min-width:0;min-height:40px;font-size:15px;padding:6px 8px}
.resrow select.rsel[data-v="Disponible"]{border-color:var(--good);background:var(--good-soft);color:var(--good-ink)}
.resrow select.rsel[data-v="En taller"],.resrow select.rsel[data-v="Mantención"]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn-ink)}
.resrow select.rsel[data-v="Préstamo"]{border-color:var(--accent);background:var(--accent-soft)}
.resrow b{font:700 16px/1.2 var(--f-display);white-space:nowrap}
.rescell{display:flex;flex-direction:column;gap:6px;min-width:0}
.rescell .resdet{min-height:38px;font-size:14.5px;padding:6px 10px}
.movlist .rescell{margin-bottom:8px}
.resrow input.pat{text-transform:uppercase;font-weight:700;letter-spacing:.06em;text-align:center}
@media (max-width:560px){.resrow.rhead{display:none}}

/* tablas de medicamentos */
.mt{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.mr{display:grid;grid-template-columns:minmax(150px,1.6fr) repeat(4,minmax(76px,1fr)) minmax(132px,auto);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line-2)}
.mr.p3{grid-template-columns:minmax(150px,2fr) repeat(2,minmax(76px,1fr)) minmax(132px,auto)}
.mr.p4{grid-template-columns:minmax(150px,1.6fr) repeat(3,minmax(76px,1fr)) minmax(132px,auto)}
.mr.p6{grid-template-columns:minmax(140px,1.5fr) repeat(5,minmax(66px,1fr)) minmax(124px,auto)}
.mr.p5c{grid-template-columns:minmax(170px,1.7fr) repeat(4,minmax(70px,1fr)) 185px}
.mr.p5c .phase2{border-left:2px solid var(--line);padding-left:10px;margin-left:-6px}
.mr.mphase{padding-block:8px 0;background:var(--surface-2);border-top:0}
.mr.mphase span{font:700 11px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.mr.mphase .ph1{grid-column:2 / span 2;color:var(--info-ink);border-bottom:2px solid var(--info-ink);padding-bottom:5px}
.mr.mphase .ph2{grid-column:4 / span 2;color:var(--good-ink);border-bottom:2px solid var(--good-ink);padding-bottom:5px}
.mr.mphase + .mh{border-top:0}
.mname small b{color:var(--ink)}
.mcell.uso input:not(:placeholder-shown){border-color:var(--info-ink);background:var(--info-soft)}
.mcorr{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 10px;border-radius:8px;background:var(--info-soft)}
.mcorr label{font:700 13px/1.2 var(--f-display);color:var(--info-ink)}
.mcorr input{flex:1 1 220px;min-height:40px;font-weight:700}
.mcorr .muted{font-size:12.5px}
.mr[data-flag="warn"] .mcorr{background:var(--surface)}
.mcell.repo input{border-color:var(--good);background:var(--good-soft)}
.mcell.repo input:placeholder-shown{border-color:var(--line);background:var(--field)}
.mr:first-child{border-top:0}
.mh{background:var(--surface-2);font:600 12px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding-block:10px}
.mname{font-weight:600;min-width:0;display:flex;flex-direction:column;gap:2px}
.mname small{font-weight:500;font-size:13px;color:var(--ink-3)}
.mname small.low{color:var(--warn-ink);font-weight:600}
.mname small.out{color:var(--crit-ink);font-weight:600}
.mcell{display:flex;flex-direction:column;gap:4px;min-width:0}
.mcell .mlbl{display:none;font:600 11.5px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.mcell input{min-height:42px;text-align:center;font-weight:700;font-size:17px;padding:8px 6px}
.mstat{font:600 14px/1.2 var(--f-display);letter-spacing:.03em;display:inline-flex;gap:7px;align-items:center;color:var(--ink-3)}
.mstat .ic{width:20px;height:20px;font-size:12px}
.mstat.ok{color:var(--good-ink)}
.mstat.ok .ic{background:var(--good-soft);color:var(--good-ink)}
.mstat.crit{color:var(--crit-ink)}
.mstat.warn{color:var(--warn-ink)}
.mstat.muted .ic{background:var(--surface-2);color:var(--ink-3)}
.mr[data-flag="crit"]{background:var(--crit-soft)}
.mr[data-flag="warn"]{background:var(--warn-soft)}
@media (max-width:720px){
  .mr,.mr.p3,.mr.p4,.mr.p6,.mr.p5c{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:8px}
  .mr.mphase{display:none}
  .mr.p5c .phase2{border-left:0;padding-left:0;margin-left:0}
  .mname,.mstat{grid-column:1/-1}
  .mh{display:none}
  .mcell .mlbl{display:block}
}

/* otros medicamentos */
.jlist{display:flex;flex-direction:column;gap:6px}
.jitem{display:grid;grid-template-columns:56px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:6px 6px 6px 12px;border:1px solid var(--line-2);border-left:4px solid var(--accent);border-radius:8px}
.jitem .jh{font:700 16px var(--f-display);color:var(--accent)}
.jitem .jt{overflow-wrap:anywhere}
.jitem .xbtn.armed{width:auto;padding:0 8px;font-size:13px}
.userbox{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:600;font-size:14px;margin-right:4px}
.top .userbox .btn{min-height:36px}
.login{position:fixed;inset:0;z-index:70;background:var(--brand);display:grid;place-items:center;padding:16px;overflow:auto}
.login-card{width:100%;max-width:380px;background:var(--surface);color:var(--ink);border-radius:16px;padding:28px 26px;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--brand-y);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.login-card img{align-self:center}
.login-card .eyebrow{color:var(--accent);text-align:center}
.login-card h2{margin:0;text-align:center;font:700 28px/1.1 var(--f-display)}
.login-card .muted{text-align:center;margin:0}
.login-card .small{font-size:12.5px}
.login-card input{font-size:20px;text-align:center;letter-spacing:.08em}
.test-tag{margin:-2px 0 0;text-align:center;font:700 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--warn-ink);background:var(--warn-soft);padding:7px 10px;border-radius:999px;align-self:center}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;font-size:14px;cursor:pointer;padding:4px}
.login-card select{font-size:18px;min-height:52px}
.login-who{margin:-4px 0 0;min-height:20px;text-align:center;font-weight:600;color:var(--accent)}
.login-err{margin:0;min-height:20px;text-align:center;color:var(--crit-ink);font-weight:600}
.acclist{display:flex;flex-direction:column;gap:6px}
.accrow{display:grid;grid-template-columns:48px minmax(0,1fr) 92px 130px auto 44px;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line-2)}
.accrow b{font:700 15px var(--f-display)}
.accrow input{min-height:40px;padding:6px 8px}
@media (max-width:700px){.accrow{grid-template-columns:48px minmax(0,1fr) 92px}.accrow input[data-accpin]{grid-column:1/3}}
.jpor{display:block;font-size:12px;color:var(--ink-3)}
.mvb{display:inline-block;margin-left:6px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font:700 11px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;vertical-align:2px}
.tv-bas{font:600 15px var(--f-body);color:#aab3dd;letter-spacing:.04em;text-transform:uppercase;margin-left:4px}
.sevrow{display:flex;flex-direction:column;gap:10px}
.sevpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sevpick .sl{font-size:14px;font-weight:600;color:var(--ink-2);margin-right:4px}
.sevpick button{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:600 15px/1 var(--f-body);cursor:pointer}
.sevpick button i{width:14px;height:14px;border-radius:50%;flex:none}
.sevpick button[data-sev="g"] i{background:var(--good)}.sevpick button[data-sev="y"] i{background:var(--warn)}.sevpick button[data-sev="r"] i{background:var(--crit)}
.sevpick button[aria-pressed="true"]{color:#fff}.sevpick button[aria-pressed="true"] i{background:#fff!important}
.sevpick button[aria-pressed="true"][data-sev="g"]{background:var(--good-ink);border-color:var(--good-ink)}
.sevpick button[aria-pressed="true"][data-sev="y"]{background:var(--warn);border-color:var(--warn);color:var(--on-warn)}.sevpick button[aria-pressed="true"][data-sev="y"] i{background:var(--on-warn)!important}
.sevpick button[aria-pressed="true"][data-sev="r"]{background:var(--crit);border-color:var(--crit)}
.sevrow input:disabled{background:var(--surface-2);border-style:dashed}
.jitem.sev-g{border-left-color:var(--good)}.jitem.sev-y{border-left-color:var(--warn)}.jitem.sev-r{border-left-color:var(--crit)}
.jsev{display:inline-block;font:700 11px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;margin-right:8px;vertical-align:2px}
.jsev.g{background:var(--good-soft);color:var(--good-ink)}.jsev.y{background:var(--warn-soft);color:var(--warn-ink)}.jsev.r{background:var(--crit-soft);color:var(--crit-ink)}
.syncstate{font-size:13px;color:rgba(255,255,255,.72);white-space:nowrap}
.syncstate[data-st="on"]{color:#9be7a8}
.syncstate[data-st="off"]{color:#ffd58a;font-weight:600}
.gtools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.gtools input[type="search"]{flex:1 1 220px;width:auto}
.gcount{font-size:14px;color:var(--ink-3);margin-left:auto}
.ggrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.gtile .step button{width:38px}
.gtile .step input{width:46px}
.gtile{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 5px 5px 12px;border:1px solid var(--line-2);border-radius:8px;min-width:0}
.gtile .gname{min-width:0;font-weight:500;line-height:1.2;overflow-wrap:anywhere}
.gtile .gname small{display:block;font-size:12px;color:var(--ink-3)}
.gtile.used{border-color:var(--accent);background:var(--accent-soft)}
.gtile.used .gname{font-weight:700}
.gtile .xbtn{width:32px;height:32px;font-size:18px}
.gadd{display:flex;gap:8px;flex-wrap:wrap}
.gadd input{flex:1 1 240px;width:auto}

/* refrigerador */
.tgrid{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(200px,1.3fr);align-items:end}
@media (max-width:760px){.tgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.tgrid > .fld{grid-column:1/-1}}
.tgrid.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tgrid.t3 .tin input{font-size:28px}
.tbox{display:flex;flex-direction:column;gap:6px;min-width:0}
.tin{display:flex;align-items:baseline;justify-content:center;gap:4px;border:1.5px solid var(--line);border-radius:10px;background:var(--field);padding:6px 10px;transition:border-color .2s,background .2s}
.tin input{border:0;background:transparent;width:100%;min-width:0;min-height:48px;text-align:right;font:700 32px/1 var(--f-display);padding:0;color:var(--ink)}
.tin input:focus{box-shadow:none}
.tin em{font:600 17px var(--f-display);font-style:normal;color:var(--ink-3)}
.tin:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tbox[data-st="ok"] .tin{border-color:var(--good)}
.tbox[data-st="bad"] .tin{border-color:var(--crit);background:var(--crit-soft)}
.tbox .tnote{font-size:13px;color:var(--ink-3);min-height:18px}
.tbox[data-st="bad"] .tnote{color:var(--crit-ink);font-weight:600}
.tstatus{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:9px;background:var(--surface-2);font-weight:500}
.tstatus.ok{background:var(--good-soft);color:var(--good-ink)}
.tstatus.crit{background:var(--crit-soft);color:var(--crit-ink)}
.tstatus.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chartbox{border:1px solid var(--line-2);border-radius:9px;padding:12px 12px 8px;min-width:0}
.chart-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chart-h strong{font:700 17px/1 var(--f-display);min-width:130px;text-align:center}
.chart-h .grow{flex:1}
.mbtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;color:var(--ink)}
.chart{position:relative;width:100%;min-height:200px}

.tip{position:absolute;top:4px;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:13px;line-height:1.35;white-space:nowrap;z-index:2;box-shadow:0 4px 14px rgba(0,0,0,.18)}

.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:600 13.5px/1 var(--f-display);color:var(--ink-2);cursor:pointer}

.fchip[data-v="out"]:not(.on){color:var(--crit-ink)}.fchip[data-v="low"]:not(.on){color:var(--warn-ink)}.fchip[data-v="ok"]:not(.on){color:var(--good-ink)}
.sgroup h3{margin:14px 0 8px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;align-items:start}

.sitem[data-st="out"]{border-top-color:var(--crit);background:linear-gradient(180deg,var(--crit-soft),var(--surface) 70%)}
.sitem[data-st="none"]{border-top-color:var(--line);border-style:dashed}
.sitem.open{grid-column:1/-1;box-shadow:0 6px 22px rgba(0,0,0,.10)}
.sitem-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

.sacts{display:flex;gap:6px;margin-top:2px}
.sbtn{flex:1 1 auto;white-space:nowrap;min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font:700 13.5px/1 var(--f-display);cursor:pointer;color:var(--ink);padding:0 8px}

.snone{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.snone .fld{width:150px}.snone p{flex:1 1 180px;margin:0;font-size:13px}

.sempty{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:34px 10px;border:1px dashed var(--line);border-radius:12px}

<script>
(() => {
'use strict';
const SELF_SCRIPT = document.currentScript;

/* ================== catálogos (desde las planillas en papel) ================== */
const CONTROLADOS = ['Morfina 10 mg','Haldol 5 mg','Diazepam 10 mg','Midazolam 5 mg','Midazolam 15 mg','Lorazepam 4 mg'];
const GENERALES = ['Aspirina 500 mg','Amiodarona','Adenosina','Atropina','Betametasona','Captopril','Clorfenamina','Epinefrina','Flumazenil','Furosemida','Hidrocortisona 100 mg','Berodual','Ketorolaco','Ác. tranexámico','Naloxona','Ondansetrón','Quikclot Combat','Celox-A jeringa','Celox-A granulado','Spongostan','Hyfin Vent (parche 3 puntas)'];
/* Stock mueble de fármacos (columna STOCK de la planilla) */
const STOCK_INICIAL = {'Aspirina 500 mg':10,'Amiodarona':20,'Adenosina':20,'Atropina':20,'Betametasona':30,'Captopril':10,'Clorfenamina':30,'Epinefrina':30,'Flumazenil':10,'Furosemida':20,'Hidrocortisona 100 mg':30,'Berodual':5,'Ketorolaco':30,'Ác. tranexámico':10,'Naloxona':10,'Ondansetrón':20,'Quikclot Combat':6,'Celox-A jeringa':6,'Celox-A granulado':6,'Spongostan':6,'Hyfin Vent (parche 3 puntas)':5,'Parche Zoll adulto':3,'Parche Zoll pediátrico':1,'Parche DEA Zoll':1,'Parche DEA Mindray':1,'Parche Corpuls adulto':1,'Parche Corpuls pediátrico':1};
/* Móviles (planilla Entrega de turno conductores) */
const FLOTA_INICIAL = ['90','91','92','89','76','79','68','69','19'].map(n => ({marca:'M.Benz', num:n, patente:''}));
/* móviles que deben estar siempre en la lista (se agregan si faltan, también en los datos que vienen de Google) */
const FLOTA_FIJA = ['19'];
function ensureFlota() { const F = store.settings.flota; if (!Array.isArray(F)) return; FLOTA_FIJA.forEach(n => { if (!F.some(f => String(f.num).trim() === n)) F.push({marca:'M.Benz', num:n, patente:''}); }); }
/* Personal SAMU Punta Arenas (* = suplente) */
const PERSONAL_TXT = ''; /* la nómina llega desde Google después de entrar con clave */
const PERSONAL_INICIAL = PERSONAL_TXT.trim().split('\n').filter(Boolean).map(l => { const [c, n] = l.split('|'); return {clave:c.replace('*', ''), nombre:n.trim(), sup:c.endsWith('*')}; });
const ROL_NAME = {R:'Reanimadores', PM:'Paramédicos', C:'Conductores', O:'Otros'};
const PARCHES = ['Parche Zoll adulto','Parche Zoll pediátrico','Parche DEA Zoll','Parche DEA Mindray','Parche Corpuls adulto','Parche Corpuls pediátrico'];
const EQUIPOS = [['monitores','Monitores desfibriladores'],['vm','VM (ventiladores mecánicos)'],['aspiracion','Bombas de aspiración'],['multiparametros','Multiparámetros'],['dea','DEA'],['infusion','Bombas de infusión'],['carboxi','Sensor de carboxihemoglobina'],['gases','Sensor de gases'],['videolaringo','Video laringoscopio']];
const ROLES = [['r','R','Reanimador'],['pm','PM','Paramédico'],['c','C','Conductor']];
/* el móvil 4 es básico: solo paramédico y conductor, sin reanimador */
const BASICO = 3;
const movRoles = i => i === BASICO ? ROLES.filter(([k]) => k !== 'r') : ROLES;
const movKeys = i => movRoles(i).map(r => r[0]);
const movRadios = i => movRoles(i).length;
const RAD_ROL = ['R', 'PM', 'C'], RAD_NOM = ['reanimador', 'paramédico', 'conductor'];
const isRP = r => String(r || '').trim().toUpperCase() === 'RP';
const radTxt = (m, sep) => (m.radios || []).map((r, k) => filled(r) ? `${RAD_ROL[k]} ${isRP(r) ? 'radio propia' : r}` : '').filter(Boolean).join(sep);
/* dónde está cada número de radio (móviles y registro); la radio propia (RP) no cuenta */
function radioUsos(e) {
  const o = {}, put = (r, where, path) => { if (!filled(r) || isRP(r)) return; const k = rkey(r); (o[k] = o[k] || []).push({where, path}); };
  e.moviles.forEach((m, i) => (m.radios || []).forEach((r, k) => put(r, `${movName(e, i)} (${RAD_ROL[k]})`, `moviles.${i}.radios.${k}`)));
  ((e.radios && e.radios.registro) || []).forEach((x, i) => put(x.num, `el registro de radios${filled(x.func) ? ' (' + x.func + ')' : ''}`, `radios.registro.${i}.num`));

/* ================== registro de temperatura (refrigerador, bodega, sala de equipos) ================== */
const TEMPS = {
  refri:  {name:'Refrigerador', what:'el refrigerador', sec:'s-refri', base:'refri', mo:'momento', mx:'max', mn:'min', resp:e => e.refri.resp},
  bodega: {name:'Bodega diaria', what:'la bodega', sec:'s-bodega', base:'bodega', mo:'tMo', mx:'tMax', mn:'tMin', hum:'hum', simple:true, resp:e => e.bodega.encargado},
  salaeq: {name:'Sala de equipos', what:'la sala de equipos', sec:'s-salaeq', base:'salaeq', mo:'tMo', mx:'tMax', mn:'tMin', hum:'hum', simple:true, resp:e => e.salaeq.encargado}
};
const T_DEFAULT = {bodega:[15, 25], salaeq:[15, 25]};
/* bodega y sala de equipos: una toma por turno (T° actual y humedad): 19:00 en turno largo, 07:00 en turno noche */
const tomaHora = e => e && e.turno === 'Largo' ? '19:00' : e && e.turno === 'Noche' ? '07:00' : '';
const tomaTxt = e => tomaHora(e) ? `Toma a las ${tomaHora(e)} (turno ${e.turno.toLowerCase()})` : 'Toma: 19:00 en turno largo · 07:00 en turno noche';
const tomaVencida = e => { const h = new Date().getHours(); return e && ((e.turno === 'Largo' && h >= 19 && h < 23) || (e.turno === 'Noche' && h >= 7 && h < 12)); };
const humOf = (e, k) => { const c = TEMPS[k]; return c.hum ? num(((e && e[c.base]) || {})[c.hum]) : null; };
function tRange(k) {
  const S = store.settings;
  if (k === 'refri') return [num(S.rMin) ?? 2, num(S.rMax) ?? 8];
  const r = (S.tRanges || {})[k] || {};
  return [num(r.min) ?? T_DEFAULT[k][0], num(r.max) ?? T_DEFAULT[k][1]];
}
const rTxt = (a, b) => `${a > 0 ? '+' : ''}${fmtN(a)} a ${b > 0 ? '+' : ''}${fmtN(b)} °C`;
const fmtN = n => (Math.round(n * 10) / 10).toLocaleString('es-CL');
function tVals(e, k) { const c = TEMPS[k], o = (e && e[c.base]) || {}; return {mo:num(o[c.mo]), mx:num(o[c.mx]), mn:num(o[c.mn])}; }
function tState(e, k) {
  const [a, b] = tRange(k), v = tVals(e, k);
  if (TEMPS[k].simple) return v.mo == null ? 'none' : (v.mo < a || v.mo > b) ? 'crit' : 'ok';
  if (v.mo == null && v.mx == null && v.mn == null) return 'none';
  if (v.mo != null && (v.mo < a || v.mo > b)) return 'crit';
  if ((v.mx != null && v.mx > b) || (v.mn != null && v.mn < a)) return 'warn';
  return 'ok';
}
function tPdf(e, k) {
  const v = tVals(e, k), st = tState(e, k), o = e[TEMPS[k].base] || {};
  if (TEMPS[k].simple && (v.mo != null || humOf(e, k) != null || v.mx == null)) { const hv = humOf(e, k); return `${tomaHora(e) ? 'Toma ' + tomaHora(e) + ': ' : ''}T° ${v.mo != null ? fmtT(v.mo) + ' °C' : 'sin registro'} · humedad ${hv != null ? fmtN(hv) + ' %' : 'sin registro'}${st === 'crit' ? ' (fuera de rango)' : st === 'ok' ? ' (en rango)' : ''}`; }
  if (st === 'none') return o.temp ? `Control T° de la sala: ${o.temp}` : 'T° de la sala: sin registro';
  return `T° de la sala: momento ${fmtT(v.mo)} °C · máx ${fmtT(v.mx)} · mín ${fmtT(v.mn)} (${st === 'crit' ? 'fuera de rango' : st === 'warn' ? 'excursión registrada' : 'en rango'})`;
}

function inkColor() { return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#15201a'; }
function drawSig(cv, strokes) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  const has = Array.isArray(strokes) && strokes.length > 0;
  cv.parentElement.classList.toggle('has', has);
  if (!has) return;
  const sx = w / 600, sy = h / 200;
  ctx.strokeStyle = inkColor(); ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = 2.4 * dpr; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  strokes.forEach(s => {
    if (s.length < 4) { ctx.beginPath(); ctx.arc(s[0] * sx, s[1] * sy, 1.6 * dpr, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(s[0] * sx, s[1] * sy);
    for (let i = 2; i < s.length; i += 2) ctx.lineTo(s[i] * sx, s[i+1] * sy);
    ctx.stroke();
  });
}
function setupSigs() {
  $$('canvas[data-sig]').forEach(cv => {
    const path = cv.dataset.sig;
    drawSig(cv, get(cur(), path));
    let stroke = null;
    const pos = ev => { const r = cv.getBoundingClientRect(); return [Math.round((ev.clientX - r.left) / r.width * 600), Math.round((ev.clientY - r.top) / r.height * 200)]; };
    cv.onpointerdown = ev => {
      if (isRO()) return;
      ev.preventDefault();
      try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
      stroke = pos(ev);
      let s = get(cur(), path); if (!Array.isArray(s)) { s = []; set(cur(), path, s); }
      s.push(stroke); drawSig(cv, s);
    };
    cv.onpointermove = ev => {
      if (!stroke) return;
      const p = pos(ev), n = stroke.length, dx = p[0] - stroke[n-2], dy = p[1] - stroke[n-1];
      if (dx * dx + dy * dy < 5) return;
      stroke.push(p[0], p[1]); drawSig(cv, get(cur(), path));
    };
    cv.onpointerup = cv.onpointercancel = () => { if (stroke) { stroke = null; changed(); } };
  });
}
const redrawSigs = () => $$('canvas[data-sig]').forEach(cv => drawSig(cv, get(cur(), cv.dataset.sig)));

const AUTH_CODES = ['needs_reauth','server_not_connected','selection_required','not_in_manifest','blocked_by_policy','approval_required','not_granted','capability_disabled','capability_removed','consent_required','user_changed'];

function importBackup(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      if (!obj || !Array.isArray(obj.history)) throw new Error('formato');
      const ids = new Set(store.history.map(h => h.id)); let added = 0;
      obj.history.forEach(h => { if (h && h.id && !ids.has(h.id)) { store.history.push(normalize(h)); added++; } });
      if (obj.settings) {
        const os = obj.settings;
        if (os.nextNum) store.settings.nextNum = Math.max(store.settings.nextNum, os.nextNum);
        ['rMin','rMax','nRadios','stockCrit'].forEach(k => { if (os[k] != null) store.settings[k] = os[k]; });
        if (Array.isArray(os.personal) && os.personal.length) store.settings.personal = os.personal;
        if (Array.isArray(os.flota) && os.flota.length) store.settings.flota = os.flota;
        if (os.backup && os.backup.shareWith !== undefined) store.settings.backup = Object.assign(store.settings.backup || {}, {shareWith:os.backup.shareWith});
      }
      if (obj.stock && obj.stock.items) {
        if (!store.stock.movs.length) store.stock = obj.stock; else { const mids = new Set(store.stock.movs.map(m => m.id)); (obj.stock.movs || []).forEach(m => { if (m && m.id && !mids.has(m.id)) store.stock.movs.push(m); }); Object.keys(obj.stock.items).forEach(n => { if (!store.stock.items[n] || num(store.stock.items[n].total) == null) store.stock.items[n] = obj.stock.items[n]; }); }
        ensureStock();
      }
      if (Array.isArray(obj.recuentos)) { const rids = new Set(store.recuentos.map(r => r.id)); obj.recuentos.forEach(r => { if (r && r.id && !rids.has(r.id)) store.recuentos.push(r); }); store.recuentos.sort((a, b) => String(b.at).localeCompare(String(a.at))); }
      sortHistory(); persist(); closeSheet(); renderAll();
      toast(`Respaldo importado: ${added} entrega${added !== 1 ? 's' : ''} nueva${added !== 1 ? 's' : ''}, con nómina, móviles y stock`);
    } catch (e) { toast('El archivo no es un respaldo válido de esta planilla'); }
  };
  rd.readAsText(file);
}

/* ================== entrega en línea (varios computadores por el script de Google) ==================
   Cada computador manda solo lo que cambió (campo por campo) y recibe lo que cambiaron los demás.
   Si dos personas escriben el mismo campo a la vez, queda lo último que llegó. */
const SYNC_KEY = 'samu-entrega-turno-sync', MIGR_KEY = 'samu-entrega-migr';
const SHARED_SETTINGS = ['nextNum','flota','personal','rMin','rMax','tRanges','stockCrit','nRadios','pin','mailJef','bencina'];
const SY = {started:false, rev:null, base:null, busy:false, again:false, soonT:null, tick:null, n:0, last:null, err:'', noScript:false, act:0, adopting:false};
const clone = o => o === undefined ? undefined : JSON.parse(JSON.stringify(o));

const syncOn = () => !framed && !!scriptUrl() && !!authToken() && ((store.settings.backup || {}).sync !== false) && !SY.noScript;
function syncView() {
  /* además de las conocidas, conserva las que ya están en Google: así una versión nueva no pierde datos que esta no conoce */
  const bs = SY.base && SY.base.live && SY.base.live.settings ? Object.keys(SY.base.live.settings) : [];
  delete store.settings.abastList; /* lista antigua con teléfonos: ya no se guarda */
  const st = {}; SHARED_SETTINGS.concat(bs.filter(k => !SHARED_SETTINGS.includes(k) && k !== 'abastList')).forEach(k => { if (store.settings[k] !== undefined) st[k] = store.settings[k]; });
  const hist = {}; store.history.forEach(h => { if (h && h.id && !h.ejemplo) hist[h.id] = h; });
  return {live:{draft:store.draft, settings:st, stock:store.stock, recuentos:store.recuentos}, hist};
}
const SKIP_KEYS = {_u:1, _del:1};
function sdiff(a, b, path, out, did) {
  if (jeq(a, b)) return out;
  const isDraft = path.length === 2 && path[0] === 'live' && path[1] === 'draft';
  if (isDraft && (!a || !b || a.id !== b.id)) { out.push({p:path, v:clone(b)}); return out; }
  const isO = x => x !== null && typeof x === 'object';
  if (isO(a) && isO(b) && Array.isArray(a) === Array.isArray(b) && (!Array.isArray(a) || a.length === b.length)) {
    const d = isDraft ? a.id : did;
    const keys = new Set(Object.keys(a).concat(Object.keys(b)));
    keys.forEach(k => {
      if (SKIP_KEYS[k]) return;
      const pk = path.concat(k);
      if (!(k in b)) out.push(d ? {p:pk, d:1, did:d} : {p:pk, d:1});
      else if (!(k in a)) out.push(d ? {p:pk, v:clone(b[k]), did:d} : {p:pk, v:clone(b[k])});
      else sdiff(a[k], b[k], pk, out, d);

    return out;
  }
  out.push(did ? {p:path, v:clone(b), did} : {p:path, v:clone(b)});
  return out;
}
function sapply(st, ops, rev) {
  ops.forEach(op => {
    const p = op.p; if (!p || !p.length || (p[0] !== 'live' && p[0] !== 'hist')) return;
    if (op.did && p[0] === 'live' && p[1] === 'draft' && !(st.live && st.live.draft && st.live.draft.id === op.did)) return;
    let o = st;
    for (let i = 0; i < p.length - 1; i++) { if (o[p[i]] == null || typeof o[p[i]] !== 'object') o[p[i]] = {}; o = o[p[i]]; }
    const k = p[p.length - 1];
    if (op.d) delete o[k]; else o[k] = clone(op.v);
    if (rev != null && p[0] === 'hist' && p.length >= 2 && st.hist[p[1]]) st.hist[p[1]]._u = rev;

}
function mergeResp(base, r) {
  if (r.live) base.live = r.live;
  (r.hist || []).forEach(h => { if (!h || !h.id) return; if (h._del) delete base.hist[h.id]; else base.hist[h.id] = h; });
  return base;
}
/* computadores de la base: solo en ellos se puede tomar la entrega */
const BASE_KEY = 'samu-entrega-base';
const baseInfo = () => { try { return JSON.parse(localStorage.getItem(BASE_KEY) || 'null'); } catch (e) { return null; } };
const baseTok = () => { const b = baseInfo(); return b && b.token ? b.token : ''; };
async function syncPost(payload) {
  const c = scriptCfg(); if (!c.url) throw {code:'script_cfg'};
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 25000);
  let r;
  try { r = await fetch(c.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({token:c.token}, baseTok() ? {base:baseTok()} : {}, payload)), redirect:'follow', signal:ctl.signal}); }

  if (!j) throw {code:'bad'};
  if (!j.ok) { if (j.error === 'auth') { setTimeout(authLost, 0); throw {code:'auth'}; } throw {code: j.error === 'token' ? 'old' : j.error === 'accion' ? 'old' : 'bad', detail:j.error}; }
  return j;
}
function syncMeta(save) {
  try {
    if (save) localStorage.setItem(SYNC_KEY, JSON.stringify({url:scriptCfg().url, rev:SY.rev, baseLive:SY.base && SY.base.live}));
    else return JSON.parse(localStorage.getItem(SYNC_KEY) || 'null');
  } catch (e) { return null; }
}
function adoptSync(next) {
  const L = next.live || {};
  if (L.draft) store.draft = migrateDraft(normalize(clone(L.draft)));
  if (L.settings) { Object.assign(store.settings, clone(L.settings)); delete store.settings.abastList; ensureFlota(); }
  if (L.stock) store.stock = clone(L.stock);
  if (Array.isArray(L.recuentos)) store.recuentos = clone(L.recuentos);
  store.history = Object.values(next.hist || {}).filter(h => h && !h._del).map(h => normalize(clone(h)));
  ensureStock(); sortHistory();
  SY.adopting = true; persist(); SY.adopting = false;
  paintUser(); refreshPicker();
  if (view.mode === 'history' && !store.history.some(h => h.id === view.id)) view = {mode:'draft', id:null};
  const a = document.activeElement;
  const busy = cbxCur || $('#sheetHost').innerHTML || (a && a.closest && a.closest('#fs') && /INPUT|TEXTAREA|SELECT/.test(a.tagName));
  const sig = JSON.stringify(cur().generales.map(g => g.name)) + view.mode + view.id;
  if (busy || sig === SY.sig) { fillInputs($('#fs'), true); refresh(); renderTop(); renderBanner(); $('#fs').disabled = isRO(); }
  else { const y = window.scrollY; renderAll(); window.scrollTo(0, y); }

}
async function syncFirst() {
  const r = await syncPost({action:'pull', since:0});
  const server = mergeResp({live:{}, hist:{}}, r);
  if (!r.rev) {      /* Google vacío: este computador manda lo suyo */
    SY.base = {live:{}, hist:{}}; SY.rev = 0;
    /* traspaso al script nuevo: datos copiados del script anterior en este navegador */
    let mg = null; try { mg = JSON.parse(localStorage.getItem(MIGR_KEY) || 'null'); } catch (e) {}
    if (mg && mg.live && SES && SES.admin) { adoptSync({live:mg.live, hist:mg.hist || {}}); try { localStorage.removeItem(MIGR_KEY); } catch (e) {} toast('Datos traspasados al script nuevo de Google'); }
    return;
  }
  SY.base = server; SY.rev = r.rev;
  const local = clone(syncView()), meta = syncMeta(false);
  const next = clone(server);
  /* lo que este computador cambió sin conexión desde la última vez */
  if (meta && meta.url === scriptCfg().url && meta.baseLive) sapply(next, sdiff({live:meta.baseLive}, {live:local.live}, [], []), null);
  /* entregas guardadas aquí que Google aún no tiene */
  Object.values(local.hist).forEach(h => { if (!h._u && !next.hist[h.id]) next.hist[h.id] = h; });
  if (!jeq(next, local)) adoptSync(next);
}
async function syncCycle() {
  if (!syncOn()) return;
  if (SY.busy) { SY.again = true; return; }
  SY.busy = true;
  try {
    if (SY.rev == null) await syncFirst();
    const sent = clone(syncView());
    let ops = sdiff(SY.base, sent, [], []);
    const be = SY.base && SY.base.live ? encOf(SY.base.live.draft) : null;
    const wasEnc = isRea() && be && sameCode(be.code, SES.code);
    ops = canEdit() || wasEnc ? ops : ops.filter(o => (canMov() && opMov(o)) || (isAmb() && opNov(o)) || (isRea() && opEnc(o)));
    const r = ops.length ? await syncPost({action:'push', since:SY.rev, ops}) : await syncPost({action:'pull', since:SY.rev});
    if (r.fast) sapply(SY.base, ops, r.rev); else mergeResp(SY.base, r);
    if (r.rev !== SY.rev) SY.act = Date.now();
    SY.rev = r.rev;

    const next = sapply(clone(SY.base), sdiff(sent, now, [], []), null);

        SY.base = mergeResp({live:{}, hist:{}}, r); SY.rev = r.rev;
        adoptSync(clone(SY.base)); syncMeta(true); SY.last = new Date(); SY.err = ''; SY.errNet = false;
        toast('Google no aceptó esos cambios: solo el jefe de turno a cargo puede modificar la entrega');
        return;
      } catch (x) { e = x; }
    }
    SY.errNet = !!(e && e.code === 'net');
    SY.err = e && e.code === 'auth' ? 'La sesión venció: vuelve a entrar'
      : e && e.code === 'old' ? 'El script de Google es la versión anterior: falta actualizarlo para la entrega en línea'
      : e && e.code === 'net' ? 'Sin conexión: los cambios quedan en este computador y se envían al volver internet'

  SY.tick = setInterval(() => { SY.n++; if (document.hidden && SY.n % 4) return; if (Date.now() - SY.act < 120000 || SY.n % 4 === 0) syncCycle(); }, 3000);
}
function syncStop() { SY.started = false; clearInterval(SY.tick); clearTimeout(SY.soonT); syncPaint(); }

  if ((store.settings.backup || {}).sync === false) return 'Desactivada: este computador trabaja solo.';
  if (SY.err) return SY.err + '.';
  return SY.last ? `En línea. Última sincronización ${pad(SY.last.getHours())}:${pad(SY.last.getMinutes())}:${pad(SY.last.getSeconds())}.` : 'Conectando…';
}
