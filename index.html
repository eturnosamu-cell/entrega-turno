<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>Entrega de Turno SAMU</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#262f7c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entrega SAMU">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Colores institucionales SAMU Magallanes: azul y amarillo del escudo. Layout: barra superior fija con folio y acciones · índice de secciones (lateral en pantallas anchas, fila deslizable en tablet) · resumen de estado arriba · una tarjeta por bloque del formulario en papel */
:root{
  --bg:#f1f3f8; --surface:#ffffff; --surface-2:#e8ebf4; --field:#fbfcfe;
  --ink:#151a33; --ink-2:#414964; --ink-3:#666e88; --line:#d2d7e6; --line-2:#e3e6f0;
  --accent:#2a3489; --accent-ink:#ffffff; --accent-soft:#e0e4f6;
  --brand:#262f7c; --brand-y:#ede914; --on-brand:#ffffff; --on-y:#1f2766;
  --good:#0ca30c; --good-ink:#176d28; --good-soft:#e0f1e1;
  --warn:#fab219; --warn-ink:#7d4f00; --warn-soft:#fcefd2;
  --crit:#d03b3b; --crit-ink:#a3242a; --crit-soft:#fae2e1;
  --info-ink:#1c5cab; --info-soft:#e2edfa;
  --series:#2a78d6; --band:rgba(12,163,12,.10);
  --on-status:#ffffff; --on-warn:#1d1400; --scrim:rgba(12,16,40,.5);
  --f-display:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f1e; --surface:#141a30; --surface-2:#1d2440; --field:#0f1428;
    --ink:#e6e9f5; --ink-2:#b3b9d0; --ink-3:#8a91ab; --line:#2d3453; --line-2:#232a46;
    --accent:#a3b0ff; --accent-ink:#0c1238; --accent-soft:#1f2856;
    --brand:#1a2158;
    --good-ink:#7fd68f; --good-soft:#163020;
    --warn-ink:#f5c45a; --warn-soft:#382b0f;
    --crit-ink:#ff8f8a; --crit-soft:#3b1a1a;
    --info-ink:#8ab8f0; --info-soft:#16273b;
    --series:#3987e5; --band:rgba(12,163,12,.16); --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f1e; --surface:#141a30; --surface-2:#1d2440; --field:#0f1428;
  --ink:#e6e9f5; --ink-2:#b3b9d0; --ink-3:#8a91ab; --line:#2d3453; --line-2:#232a46;
  --accent:#a3b0ff; --accent-ink:#0c1238; --accent-soft:#1f2856;
  --brand:#1a2158;
  --good-ink:#7fd68f; --good-soft:#163020;
  --warn-ink:#f5c45a; --warn-soft:#382b0f;
  --crit-ink:#ff8f8a; --crit-soft:#3b1a1a;
  --info-ink:#8ab8f0; --info-soft:#16273b;
  --series:#3987e5; --band:rgba(12,163,12,.16); --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{width:100%}body{min-height:100vh;min-height:100dvh}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- barra superior ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--on-brand);border-bottom:4px solid var(--brand-y)}
.top :focus-visible{outline-color:var(--brand-y)}
.top .btn{background:transparent;color:var(--on-brand);border-color:rgba(255,255,255,.35)}
.top .btn:hover{background:rgba(255,255,255,.1)}
.top .btn.primary{background:var(--brand-y);border-color:var(--brand-y);color:var(--on-y)}
.top .btn.primary:hover{filter:brightness(1.05)}
.secnav-h .nav-i{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22);color:rgba(255,255,255,.88)}
.secnav-h .nav-i:hover{color:var(--on-brand)}
.secnav-h .nav-i.on{background:var(--brand-y);border-color:transparent;color:var(--on-y)}
.secnav-h .dot{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.65)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:none;width:100%;margin:0;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
@media (max-width:1099px){.top-meta{order:3;flex-basis:100%;padding-left:61px}h1 span{display:none}}
@media (max-width:640px){.top-meta{padding-left:0}h1 span{display:none}}
.brand img{height:52px;width:auto;flex:none;filter:drop-shadow(0 0 1px rgba(255,255,255,.6))}
.eyebrow{font:600 12px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-y)}
h1{margin:0;font:700 22px/1.1 var(--f-display);text-wrap:balance}
h1 span{font-weight:500;color:rgba(255,255,255,.75)}
.top-meta{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.folio{font:700 20px/1 var(--f-display);letter-spacing:.06em;color:var(--brand-y)}
.mode{font:600 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--on-brand)}
.mode.ro{background:var(--brand-y);color:var(--on-y)}
.savestate{font-size:13px;color:rgba(255,255,255,.72)}
.savestate[data-state="fail"]{color:#ffd3cf;font-weight:600}
.top-act{display:flex;gap:8px;flex-wrap:wrap}
.secnav-h{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:none;width:100%;margin:0;padding-block:0 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.secnav-h::-webkit-scrollbar{display:none}

/* ---------- botones ---------- */
.btn{font:600 15px/1 var(--f-body);min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;font-size:14px;padding:0 12px}
.btn.lg{min-height:52px;font-size:17px;padding:0 24px}
.btn.danger{color:var(--crit-ink);border-color:var(--crit)}
.btn.armed{background:var(--crit);border-color:var(--crit);color:var(--on-status)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--info-ink);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

/* ---------- índice de secciones ---------- */
.nav-i{flex:none;display:flex;align-items:center;gap:9px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 14px/1.2 var(--f-body);color:var(--ink-2);cursor:pointer;text-align:left}
.nav-i:hover{color:var(--ink)}
.nav-i.on{background:var(--accent-soft);border-color:transparent;color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink-3)}
[data-st="done"] > .dot{background:var(--good);box-shadow:none}
[data-st="todo"] > .dot{background:var(--warn);box-shadow:none}
[data-st="crit"] > .dot{background:var(--crit);box-shadow:none}
.secnav-v{display:none}

/* ---------- estructura ---------- */
.shell{max-width:none;width:100%;box-sizing:border-box;margin:0;padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
@media (min-width:1100px){
  .secnav-h{display:none}
  .shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px}
  .secnav-v{display:flex;flex-direction:column;gap:3px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);align-self:start;max-height:calc(100vh - 110px);overflow:auto}
  .secnav-v .nav-i{border-color:transparent;background:transparent;border-radius:8px;min-height:38px}
  .secnav-v .nav-i.on{background:var(--accent-soft)}
  .secnav-v .navlbl{font:600 12px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:4px 12px 8px}
}

/* ---------- avisos superiores ---------- */
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:var(--r);background:var(--info-soft);color:var(--ink)}
.banner.ro{background:var(--warn-soft)}
.banner p{margin:0;min-width:0;flex:1 1 320px}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- resumen ---------- */
.overview{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:920px){.overview{grid-template-columns:minmax(0,1fr)}}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip.link{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.chip.link:hover{border-color:var(--accent)}
.chip.link .go{font-size:13px;color:var(--info-ink);font-weight:600}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.chip .k{font:600 12px/1.2 var(--f-display);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.chip .v{font:700 28px/1.05 var(--f-display)}
.chip .v small{font-size:16px;font-weight:600;color:var(--ink-2)}
.chip .s{font-size:13.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.chip[data-st="crit"]{border-color:var(--crit)}
.chip[data-st="crit"] .s{color:var(--crit-ink);font-weight:600}
.chip[data-st="warn"]{border-color:var(--warn)}
.chip[data-st="warn"] .s{color:var(--warn-ink);font-weight:600}
.chip[data-st="good"] .s{color:var(--good-ink);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.lastline{grid-column:1/-1;font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.alertbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 6px}
.alertbox h2{margin:0 0 4px;font:700 17px/1.2 var(--f-display);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.alertbox h2 span{font:500 13px var(--f-body);color:var(--ink-3)}
.al{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border:0;border-top:1px solid var(--line-2);width:100%;background:none;text-align:left;cursor:pointer;font-size:15px;line-height:1.35;color:var(--ink)}
.al:first-of-type{border-top:0}
.al:hover .tx{text-decoration:underline;text-underline-offset:2px}
.ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--f-display);margin-top:-1px}
.crit > .ic{background:var(--crit);color:var(--on-status)}
.warn > .ic{background:var(--warn);color:var(--on-warn)}
.info > .ic{background:var(--info-soft);color:var(--info-ink)}
.none{padding:10px 0 12px;color:var(--ink-3);font-size:15px}
.alertlist{max-height:330px;overflow:auto}

/* ---------- tarjetas de sección ---------- */
fieldset#fs{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);scroll-margin-top:150px;min-width:0}
@media (min-width:1100px){.sec{scroll-margin-top:96px}}
.sec-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 18px 12px;border-bottom:1px solid var(--line-2)}
.sec-h h2{margin:0;font:700 21px/1.15 var(--f-display);letter-spacing:.01em;color:var(--accent)}
.sub{margin:3px 0 0;color:var(--ink-3);font-size:14px}
.sec-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pill{flex:none;font:600 12.5px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good-ink)}
.pill.todo{background:var(--warn-soft);color:var(--warn-ink)}
.pill.opt{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink-3)}
.subh{margin:4px 0 0;font:700 16px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.subh span{font:500 14px var(--f-body);text-transform:none;letter-spacing:0;color:var(--ink-3)}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:860px){.duo{grid-template-columns:minmax(0,1fr)}}
.duo > .sec{margin:0}

/* ---------- campos ---------- */
.grid{display:grid;gap:14px 16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-turno{grid-template-columns:auto minmax(200px,1fr) minmax(180px,1fr) minmax(180px,1fr)}
@media (max-width:900px){.g-turno{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g-turno{grid-template-columns:minmax(0,1fr)}}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font:600 13px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
:where(input[type="text"],input[type="password"],input[type="search"],input[type="datetime-local"],input[type="number"],textarea){font:500 16px/1.3 var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:88px}
:where(input,textarea):focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
::placeholder{color:var(--ink-3);opacity:1}
fieldset:disabled :where(input,textarea,select){background:transparent;border-style:dashed}
select{font:500 16px/1.3 var(--f-body);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;min-height:46px;padding:8px 10px;width:100%;min-width:0}
select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.with-btn{display:flex;gap:8px}
.with-btn input{flex:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px;background:var(--surface-2);width:max-content;max-width:100%;flex:none}
.seg button{min-width:64px;min-height:40px;border:0;border-radius:6px;background:transparent;font:700 15px/1 var(--f-display);letter-spacing:.06em;color:var(--ink-2);cursor:pointer;padding:0 14px}
.seg button:hover{background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink-2)}
.seg button.good{background:var(--good-soft);color:var(--good-ink);box-shadow:inset 0 0 0 1.5px var(--good)}
.seg button.bad{background:var(--warn-soft);color:var(--warn-ink);box-shadow:inset 0 0 0 1.5px var(--warn)}
.seg button.neu{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.yn{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;padding:6px 0;border-bottom:1px dashed var(--line-2)}
.yn .q{font:500 16px/1.3 var(--f-body);min-width:0;flex:1 1 180px}
.ynlist{display:flex;flex-direction:column}
.ynblock{display:flex;flex-direction:column;gap:10px;padding-bottom:6px;border-bottom:1px dashed var(--line-2)}
.ynblock .yn{border-bottom:0}
.cond{padding:2px 0 6px 14px;border-left:3px solid var(--accent-soft);display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

.step{display:inline-flex;align-self:flex-start;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--field);flex:none}
.step button{width:42px;min-height:44px;border:0;background:var(--surface-2);color:var(--ink);font:600 20px/1 var(--f-body);cursor:pointer}
.step button:hover{background:var(--line-2)}
.step input{width:56px;min-height:44px;border:0;border-radius:0;text-align:center;font:700 19px/1 var(--f-display);padding:0;background:transparent;color:var(--ink)}
.step input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
fieldset:disabled .step button{visibility:hidden}

.chk{display:inline-flex;align-items:center;gap:8px;font-size:15px;cursor:pointer;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--accent)}

/* móviles */
.g-mov{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:1380px){.g-mov{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.g-mov{grid-template-columns:minmax(0,1fr)}}
.mv{border:1px solid var(--line);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mv-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mv-h strong{font:700 19px/1 var(--f-display);letter-spacing:.02em}
.mv-st{font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-3)}
.mv[data-st="done"]{border-color:var(--good)}
.mv[data-st="done"] .mv-st{background:var(--good-soft);color:var(--good-ink)}
.mv[data-st="part"]{border-color:var(--warn)}
.mv[data-st="part"] .mv-st{background:var(--warn-soft);color:var(--warn-ink)}
.crew{display:grid;grid-template-columns:40px minmax(0,1fr) 30px;align-items:center;gap:5px}
.crew .cbx input{padding-left:9px;padding-right:34px}
.crew .cbx-clr{display:none}
.crewfull{grid-column:2/-1;font:600 13px/1.3 var(--f-body);color:var(--accent);margin:-2px 0 2px 2px}
.crew .cbx-btn{width:30px;right:2px}
.splitbtn{width:30px;height:36px;border-radius:8px;border:1px dashed var(--line);background:transparent;color:var(--ink-3);font:700 15px/1 var(--f-display);cursor:pointer;padding:0}
.splitbtn:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.splitbtn.on{border-style:solid;font-size:20px;font-weight:400}
.splitbtn.on:hover{border-color:var(--crit);color:var(--crit-ink)}
.splitbtn.armed{width:auto;padding:0 6px;font-size:12px}
fieldset:disabled .splitbtn{visibility:hidden}
.crewsplit{display:flex;flex-direction:column;gap:4px;padding:6px;margin:0 -6px;border-radius:9px;background:var(--accent-soft)}
.role.two{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0}
.role.two small{font:600 10.5px/1 var(--f-display);letter-spacing:0;color:var(--ink-3)}
.splith{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);padding-left:45px}

.stsum{display:flex;flex-wrap:wrap;gap:8px}
.mvlist{display:flex;flex-direction:column;font-size:14px}
.mvlist div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.mvlist .plus{color:var(--good-ink);font-weight:700;white-space:nowrap}
.mvlist .minus{color:var(--crit-ink);font-weight:700;white-space:nowrap}
.mvlist .eq{color:var(--info-ink);font-weight:700;white-space:nowrap}
/* personal y móviles */
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:62px minmax(0,1fr) auto 44px;gap:10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line-2)}
.prow b{font:700 15px var(--f-display);letter-spacing:.04em}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr) 44px;gap:8px;align-items:center}
.frow.fhead{font:600 12px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.padd{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}

/* lista de funcionarios (combobox) */
.cbx{position:relative;min-width:0}
.cbx input{padding-right:84px}
.cbx-btn,.cbx-clr{position:absolute;top:50%;transform:translateY(-50%);height:36px;border:0;border-radius:7px;background:transparent;color:var(--ink-3);cursor:pointer;display:grid;place-items:center}
.cbx-btn{right:4px;width:38px;font-size:15px}
.cbx-clr{right:44px;width:36px;font-size:20px}
.cbx-btn:hover,.cbx-clr:hover{background:var(--surface-2);color:var(--ink)}
.cbx input:placeholder-shown ~ .cbx-clr{display:none}
fieldset:disabled .cbx-btn,fieldset:disabled .cbx-clr{display:none}
.cbx.open input{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cbx-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;max-height:290px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(15,20,50,.18);padding:4px;display:flex;flex-direction:column;gap:1px;min-width:220px}
.cbx-opt{display:flex;gap:8px;align-items:baseline;text-align:left;width:100%;min-height:42px;padding:9px 10px;border:0;border-radius:7px;background:transparent;color:var(--ink);font:500 15px/1.25 var(--f-body);cursor:pointer}
.cbx-opt b{font:700 14px/1.25 var(--f-display);min-width:38px;color:var(--accent)}
.cbx-opt small{margin-left:auto;font-size:12px;color:var(--ink-3)}
.cbx-opt:hover,.cbx-opt.act{background:var(--accent-soft)}
.cbx-opt.libre{color:var(--ink-2);font-style:italic;border-bottom:1px dashed var(--line);border-radius:7px 7px 0 0;margin-bottom:2px;position:sticky;top:-4px;z-index:1;background:var(--surface)}
.cbx-opt.libre:hover{background:var(--accent-soft)}
.cbx-grp{font:600 11.5px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px}
.cbx-none{margin:0;padding:10px;color:var(--ink-3);font-size:14px}
.crew .cbx{flex:1}

/* recuento semanal */
.rct{display:flex;flex-direction:column;border:1px solid var(--line-2);border-radius:9px;overflow:hidden}
.rcr{display:grid;grid-template-columns:minmax(140px,1.8fr) 64px 72px 92px 86px;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line-2)}
.rcr:first-child{border-top:0}
.rcr.h{background:var(--surface-2);font:600 12px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.rcr .n{text-align:center;font-weight:600}
.rcr input{min-height:40px;text-align:center;font-weight:700;padding:6px}
.rcr .rep{text-align:center;font:700 18px/1 var(--f-display)}
.rcr .rep.si{color:var(--crit-ink)}
.rcr .rep.no{color:var(--ink-3)}
.rcr .nm{font-weight:600;min-width:0}
.rcr .nm small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
@media (max-width:600px){.rcr{grid-template-columns:minmax(0,1fr) 56px 76px 64px}.rcr .tot{display:none}}
.rcsum{font-weight:600}

/* respaldo */
.banner.bk{background:var(--warn-soft)}
.banner.bkok{background:var(--good-soft)}
.bkbox{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line-2);border-radius:9px;padding:12px 14px}
.bkstate{font-weight:600}
.bkstate.ok{color:var(--good-ink)}
.bkstate.warn{color:var(--warn-ink)}

/* hoja modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:660px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding-top:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:14px}}
.sheet h2{margin:0;font:700 23px/1.15 var(--f-display)}
.sheet h3{margin:0;font:700 15px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.sheet p{margin:0}
.sheet ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.sheet-act{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.sblock{border-radius:9px;padding:12px 14px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.sblock.warn{background:var(--warn-soft)}
.sblock.ok{background:var(--good-soft);color:var(--good-ink);font-weight:600}
.hlist{display:flex;flex-direction:column;gap:8px}
.hitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;color:var(--ink)}
.hitem:hover{border-color:var(--accent)}
.hitem b{font:700 17px/1.2 var(--f-display);letter-spacing:.03em}
.hitem .meta{font-size:14px;color:var(--ink-2)}
.hitem .tags{grid-row:1/3;grid-column:2;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font:600 12px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.crit{background:var(--crit-soft);color:var(--crit-ink)}
.tag.warn{background:var(--warn-soft);color:var(--warn-ink)}
.tag.ok{background:var(--good-soft);color:var(--good-ink)}
.srow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--ink-3);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:60;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}

@media (max-width:640px){
  .top{position:relative;top:0}
  .top-act{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
  .top-act .userbox{grid-column:1/-1;justify-content:space-between}
  .top-act [data-act="tvOpen"]{display:none}
  .top-act #topSave{grid-column:1/-1}
  .sec{scroll-margin-top:12px!important}
  h1{font-size:19px}
  .brand img{height:44px}
  .sec-h{padding:12px 14px 10px}
  .sec-b{padding:14px}
  .top-act .btn{min-height:40px;padding:0 12px;font-size:14px}
  .savestate{display:none}
  .folio{font-size:18px}
  .sec{scroll-margin-top:200px}
}
@media print{
  body::before,.secnav-h,.secnav-v,.top-act,.banner,.alertbox,.btn,.xbtn,.gtools,.gadd,.mbtn,.toast,.scrim,.step button,.key,.chart-h .btn{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  .top{position:static;border:0}
  .shell{display:block;padding:0}
  .sec{break-inside:avoid;border-color:#999;margin-bottom:8px}
  .seg button:not([aria-pressed="true"]){display:none}
  .gtile:not(.used){display:none}
}

/* ---------- pantalla TV (se abre con #tv al final de la dirección) ---------- */
html.tvmode,html.tvmode body{height:100%;overflow:hidden;background:#0d1240}
html.tvmode body::before{display:none}
#tv{position:fixed;inset:0;background:#0d1240;color:#fff;font-family:var(--f-body)}
#tv.nocur{cursor:none}
.tvs{position:absolute;left:50%;top:50%;width:1920px;height:1080px;padding:38px 48px 40px;display:grid;grid-template-rows:auto auto auto minmax(0,1fr)}
.tv-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:30px;align-items:center;padding-bottom:22px;border-bottom:3px solid #ede914}
.tv-h img{height:104px;width:auto}
.tv-eye{font:700 22px/1 var(--f-display);letter-spacing:.16em;color:#ede914;text-transform:uppercase}
.tv-t{font:700 46px/1.1 var(--f-display);margin:8px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-sub{font:500 25px/1.2 var(--f-body);color:#c7cdee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-sub b{color:#fff;font-weight:700}
.tv-box{border:2px solid #333d93;background:#1a2063;border-radius:12px;padding:14px 26px;min-width:300px}
.tv-box .k{font:700 18px/1 var(--f-display);letter-spacing:.14em;color:#ede914;text-transform:uppercase}
.tv-box .v{font:700 30px/1.25 var(--f-display);margin-top:8px;white-space:nowrap}
.tv-clock{text-align:right}
.tv-clock b{display:block;font:700 100px/.95 var(--f-display)}
.tv-clock span{font-size:20px;color:#c7cdee;white-space:nowrap}
.tv-clock span.live{color:#7fe08f}
.tv-sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 14px;font:700 26px/1 var(--f-display);letter-spacing:.14em;color:#c7cdee;text-transform:uppercase}
.tv-sec span{font:500 23px var(--f-body);letter-spacing:0;text-transform:none;color:#fff}
.tv-mov{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.tv-card{background:#1a2063;border:2px solid #2c357f;border-radius:14px;padding:22px 26px 18px;display:flex;flex-direction:column;min-width:0}
.tv-card.empty{opacity:.45}
.tv-ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.tv-ch b{font:700 52px/1 var(--f-display);white-space:nowrap}
.tv-pill{font:700 21px/1 var(--f-display);padding:8px 14px;border-radius:999px;white-space:nowrap;background:#2a3489;color:#fff}
.tv-pill.ok{background:#1e8a3e}
.tv-pill.warn{background:#fab219;color:#1d1400}
.tv-pill.crit{background:#d03b3b}
.tv-pill.soft{background:#e0e4f6;color:#1f2766}
.tv-rl{font:600 17px/1 var(--f-display);letter-spacing:.12em;color:#aab3dd;text-transform:uppercase;margin-top:10px}
.tv-rv{font:700 31px/1.15 var(--f-display);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-rv.miss{color:#6f78ad;font-weight:600}
.tv-rv.sp{font-size:25px;line-height:1.1;display:flex;align-items:baseline;gap:8px;margin-top:2px}
.tv-rv.sp i{font:700 26px/1 var(--f-display);font-style:normal;color:#ede914;flex:none;margin-right:-2px}
.tv-rv.sp.off{opacity:.45}
.tv-rv.sp.off i{background:#aab3dd}
.tv-rad{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:14px;border-top:1px solid #343e8c;font-size:21px;color:#c7cdee}
.tv-rad b{font:700 34px/1 var(--f-display);color:#ede914;letter-spacing:.02em}
.tv-bot{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:26px;min-height:0}
.tv-pan{background:#1a2063;border:2px solid #2c357f;border-radius:14px;padding:18px 28px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.tv-pan .tv-sec{margin:0 0 12px}
.tv-win{flex:1;min-height:0;overflow:hidden;position:relative}
.tv-roll{will-change:transform}
@keyframes tvroll{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.tv-nv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;align-items:center;padding:13px 0;border-top:1px solid #343e8c}
.tv-tag{font:700 19px/1.1 var(--f-display);text-align:center;padding:8px 6px;border-radius:7px;background:#2a3489;color:#fff;border:1px solid #4651b0}
.tv-tag.crit{background:#d03b3b;border-color:#d03b3b}
.tv-tag.warn{background:#fab219;border-color:#fab219;color:#1d1400}
.tv-tag.jef{background:#fff;border-color:#fff;color:#1f2766}
.tv-tag.nov{background:#ede914;border-color:#ede914;color:#1f2766} .tv-tag.sev-r{background:#d03b3b;border-color:#d03b3b;color:#fff} .tv-tag.sev-y{background:#fab219;border-color:#fab219;color:#1d1400} .tv-tag.sev-g{background:#1f8f3a;border-color:#1f8f3a;color:#fff}
.tv-nt{font:500 26px/1.25 var(--f-body)}
.tv-none{font-size:24px;color:#aab3dd;padding:14px 0}
.tv-li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #343e8c}
.tv-li b{font:700 32px/1.05 var(--f-display);white-space:nowrap}
.tv-tr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.tv-tr b{font:700 38px/1 var(--f-display)}
.tv-li small{display:block;font:500 19px var(--f-body);color:#aab3dd;margin-top:4px}
.tv-st{padding:12px 0;border-top:1px solid #343e8c}
.tv-st .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:22px;color:#c7cdee}
.tv-st .r b{font:700 30px var(--f-display);color:#fff;white-space:nowrap}
.tv-bar{height:12px;border-radius:6px;background:#2c357f;overflow:hidden;margin-top:9px}
.tv-bar i{display:block;height:100%;border-radius:6px;background:#3fce6f}
.tv-bar.warn i{background:#fab219}
.tv-bar.crit i{background:#e5484d}
.tv-tr b small.u{display:inline;font:500 22px var(--f-body);color:#c7cdee;margin:0}
.tv-li small.ok{color:#7fe08f;font-weight:600}
.tv-plate{font:700 32px/1 var(--f-display);letter-spacing:.08em;background:#f4f5fb;color:#151a33;border:3px solid #151a33;box-shadow:0 0 0 2px #f4f5fb;border-radius:8px;padding:8px 14px;white-space:nowrap}
.tv-plate.none{background:transparent;color:#aab3dd;border:2px dashed #4651b0;box-shadow:none;font-size:22px;letter-spacing:0}
.tv-go{position:fixed;inset:0;display:grid;place-items:center;background:rgba(8,11,40,.72);z-index:5}
.tv-go[hidden]{display:none}
.tv-go-card{background:#1a2063;border:2px solid #ede914;border-radius:18px;padding:34px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:520px;color:#fff}
.tv-go-card b{font:700 34px/1 var(--f-display);color:#ede914}
.tv-go-card span{font-size:19px;color:#c7cdee}
.tv-act{display:flex;flex-direction:column;gap:10px;width:100%;padding:14px;border-radius:12px;background:rgba(255,255,255,.06)}
.tv-act[hidden]{display:none}
.tv-act span{font-size:16px;color:#c7cdee}
.tv-act-f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tv-act-f input{font:600 20px var(--f-body);padding:12px;border-radius:10px;border:0;text-align:center;background:#fff;color:#151a33;min-width:0}
.tv-local{background:none;border:0;color:#aab3dd;text-decoration:underline;font-size:14px;cursor:pointer}
.tv-act small{color:#ffd58a;min-height:18px}
.tv-go-card small{font-size:14px;color:#aab3dd}
.tv-go-card button{font:700 24px/1 var(--f-display);background:#ede914;color:#1f2766;border:0;border-radius:12px;padding:18px 34px;cursor:pointer}
.tv-fsbtn{position:fixed;right:18px;top:18px;z-index:6;font:700 16px var(--f-display);background:#ede914;color:#1f2766;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;transition:opacity .4s}
.tv-fsbtn.hide{opacity:0;pointer-events:none}
.tv-hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:10px 18px;border-radius:10px;font-size:16px;transition:opacity .6s}
</style>

function migrateDraft(e) {
  const old = Array.isArray(e.generales) ? e.generales : [], used = new Set();
  const out = GENERALES.map(name => {
    const k = norm(name);
    let i = old.findIndex((g, j) => !used.has(j) && norm(g.name) === k);
    if (i < 0) i = old.findIndex((g, j) => !used.has(j) && !g.extra && k.startsWith(norm(g.name) + ' '));
    if (i >= 0) { used.add(i); return {name, uso: old[i].uso || ''}; }
    return {name, uso:''};
  });
  old.forEach((g, j) => { if (!used.has(j)) out.push({name:g.name, uso:g.uso || '', extra:true}); });
  e.generales = out;
  e.parches = (e.parches || []).map(p => Object.assign({uso:''}, p));
  (e.moviles || []).forEach(m => ['r','pm','c'].forEach(k => {
    if (m[k + '2'] != null) m[k] = [m[k], m[k + '2']].filter(filled).join(' / ');
    delete m[k + '2']; delete m[k + 'H'];
    if (!filled(m[k])) return;
    m[k] = String(m[k]).split('/').map(v => { v = v.trim(); const pp = (store.settings.personal || []).find(x => staffLabel(x) === v); return pp ? shortLabel(pp) : v; }).join(' / ');
  }));
  return e;
}

  if (!store.stock.items) store.stock.items = {};
  if (!Array.isArray(store.stock.movs)) store.stock.movs = [];
  const now = new Date().toISOString();

    if (!store.stock.items[n]) { const t = STOCK_INICIAL[n]; store.stock.items[n] = {total: t ?? null, min:null, base: t ?? null, baseAt: now}; }

}

const critPct = () => { const v = num(store.settings.stockCrit); return v != null && v >= 0 ? v : 10; };
function stockInfo(name) {
  const it = store.stock && store.stock.items[name];
  if (!it || num(it.total) == null) return null;
  const t0 = it.baseAt || '', total = num(it.total);
  let d = num(it.base) ?? total, usedSince = 0;
  store.stock.movs.forEach(m => { if (m.name === name && m.tipo === 'repo' && m.at > t0) d += m.cant; });
  store.history.forEach(h => { if (!h.ejemplo && h.savedAt && h.savedAt > t0) { const u = usoEn(h, name); d += repoEn(h, name) - u; usedSince += u; } });
  const draftUse = usoEn(store.draft, name), draftRepo = repoEn(store.draft, name), proj = d - draftUse + draftRepo;
  const min = filled(it.min) ? num(it.min) : Math.floor(total * 0.25);
  const crit = proj <= 0 || proj <= total * critPct() / 100;
  return {total, disp:d, proj, draftUse, draftRepo, min, usedSince, st: crit ? 'out' : (min > 0 && proj <= min) ? 'low' : 'ok'};

let persistT = null;
function load() {
  let raw = null, ok = true;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) { ok = false; }
  if (raw) {
    try {
      const s = JSON.parse(raw);
      if (s && s.settings) {
        store.settings = Object.assign(defaultSettings(), s.settings);
        if (!Array.isArray(store.settings.personal) || !store.settings.personal.length) store.settings.personal = defaultSettings().personal;
        if (!Array.isArray(store.settings.flota)) store.settings.flota = defaultSettings().flota;
        store.history = Array.isArray(s.history) ? s.history.map(normalize) : [];
        store.draft = s.draft ? migrateDraft(normalize(s.draft)) : null;
        store.stock = s.stock || null;
        store.recuentos = Array.isArray(s.recuentos) ? s.recuentos : [];
      }
    } catch (e) { /* datos dañados: se parte de cero */ }
  }
  const nHist = store.history.length;
  store.history = store.history.filter(h => !h.ejemplo);
  if (raw && store.history.length !== nHist) setTimeout(persist, 0);
  if (!store.draft) store.draft = blankEntry();
  ensureStock();
  sortHistory();
  if (ok) {
    try {
      const done = localStorage.getItem(MIG_KEY) || '', marks = done ? done.split(',') : [];
      let mig = false;
      if (!marks.includes('n1')) { store.settings.nextNum = 1; marks.push('n1'); mig = true; }
      if (!marks.includes('p1215')) { store.settings.pin = PIN_DEFAULT; marks.push('p1215'); mig = true; }
      if (mig) { localStorage.setItem(MIG_KEY, marks.join(',')); setTimeout(persist, 0); }
    } catch (e) { /* sin almacenamiento: quedan los valores por defecto */ }
  }
  return ok;
}

  const groups = ['R','PM','C','O'].map(r => { const list = P.filter(p => rolOf(p.clave) === r); return list.length ? `<optgroup label="${ROL_NAME[r]}">${list.map(p => { const l = staffLabel(p); return `<option value="${esc(l)}">${esc(l)}${p.sup ? ' (suplente)' : ''}</option>`; }).join('')}</optgroup>` : ''; }).join('');
  const extra = filled(v) && !P.some(p => staffLabel(p) === v) ? `<option value="${esc(v)}">${esc(v)}</option>` : '';
  return `<option value="">Elegir funcionario…</option>${extra}${groups}`;
}
function staffSel(path, label) {
  return `<label class="fld" for="${fid(path)}"><span class="lbl">${label}</span><select id="${fid(path)}" data-bind="${path}" data-staffsel="1">${staffOptions(get(cur(), path))}</select></label>`;
}

function sectionMissing(e) {
  const m = {};
  const need = (sec, ok, label) => { if (!ok) (m[sec] = m[sec] || []).push(label); };
  need('s-turno', filled(e.turno), 'Turno (largo o noche)');
  need('s-turno', filled(e.fecha), 'Fecha y hora');
  need('s-turno', filled(e.jefe), 'Jefe de turno');
  let anyMovil = false;
  e.moviles.forEach((mv, i) => {
    if (!crewAny(mv)) return;
    anyMovil = true;
    const miss = movRoles(i).filter(([k]) => !crewOk(mv, k)).map(([k, c]) => filled(mv[k]) ? `${c} del 2º tramo` : c);
    if (!filled(mv.id)) miss.unshift('elegir móvil');
    const nr = movRadios(i) - mv.radios.filter(filled).length;
    if (nr > 0) miss.push(`${nr} radio${nr > 1 ? 's' : ''}`);
    if (miss.length) need('s-moviles', false, `Móvil ${i+1}: falta ${miss.join(', ')}`);
  });
  need('s-moviles', anyMovil, 'Al menos un móvil con tripulación');
  need('s-estadistica', filled(e.est.encargado), 'Encargado de estadística');
  need('s-estadistica', filled(e.est.siniestros), 'Siniestros durante el turno');
  need('s-estadistica', filled(e.est.faf), 'Notificación FAF');
  need('s-radios', filled(e.radios.cargadas), 'Radios cargadas');
  need('s-radios', filled(e.radios.base), 'Nº de radios en base');
  need('s-radios', filled(e.radios.llamado), 'Nº de radios en llamado');
  need('s-oxigeno', filled((e.oxigeno || {}).g), 'Cilindros de oxígeno 1 m³ llenos');
  need('s-oxigeno', filled((e.oxigeno || {}).p), 'Cilindros de oxígeno 0,5 m³ llenos');
  const x = e.extr;
  need('s-extricacion', filled(x.encargado), 'Encargado de extricación');
  need('s-extricacion', filled(x.guardar), 'Pendiente guardar');
  if (x.guardar === 'SI') need('s-extricacion', filled(x.guardarLugar), 'Lugar del material por guardar');
  need('s-extricacion', filled(x.rescatar), 'Pendiente por rescatar');
  if (x.rescatar === 'SI') need('s-extricacion', filled(x.rescatarLugar), 'Lugar del material por rescatar');
  need('s-extricacion', filled(x.reponer), 'Pendiente reponer');
  if (x.reponer === 'SI') need('s-extricacion', filled(x.reponerDet), 'Qué material falta reponer');
  const b = e.bodega;
  need('s-bodega', filled(b.encargado), 'Encargado de bodega');
  need('s-bodega', filled(b.tMo), 'T° momento de bodega'); need('s-bodega', filled(b.tMax), 'T° máxima de bodega'); need('s-bodega', filled(b.tMin), 'T° mínima de bodega');
  need('s-bodega', filled(b.limpia), 'Bodega limpia y ordenada');
  need('s-bodega', filled(b.reponer), 'Bodega: pendiente reponer');
  const s = e.salaeq;
  need('s-salaeq', filled(s.encargado), 'Encargado de sala de equipos');
  need('s-salaeq', filled(s.tMo), 'T° momento de sala de equipos'); need('s-salaeq', filled(s.tMax), 'T° máxima de sala de equipos'); need('s-salaeq', filled(s.tMin), 'T° mínima de sala de equipos');
  need('s-salaeq', filled(s.cargando), 'Equipos cargando');
  need('s-salaeq', filled(s.limpia), 'Sala de equipos limpia y ordenada');
  EQUIPOS.forEach(([k, n]) => need('s-equipos', filled(e.equipos[k]), n));
  const ins = e.insumos;
  need('s-insumos', filled(ins.mascara), 'Uso de máscara laríngea');
  need('s-insumos', filled(ins.trocar), 'Uso de trocar osteólisis');
  if (ins.trocar === 'SI') need('s-insumos', filled(ins.trocarTipo), 'Trocar: adulto o pediátrico');
  e.controlados.forEach(c => { if (!filled(c.ent) || !filled(c.rec)) need('s-controlados', false, `${c.name}: entregada y recibida`); });
  if (e.controlados.some(c => (num(c.repo) || 0) > 0) && !filled(e.ctrlObs)) need('s-controlados', false, 'Observaciones de la reposición de controlados');
  e.parches.forEach(p => { if (!filled(p.ent) || !filled(p.rec)) need('s-insumos', false, `${p.name}: entregada y recibida`); });
  const r = e.refri;
  need('s-refri', filled(r.momento), 'T° momento');
  need('s-refri', filled(r.max), 'T° máxima');
  need('s-refri', filled(r.min), 'T° mínima');
  need('s-refri', filled(r.resp), 'Responsable del registro de T°');
  need('s-cierre', filled(e.entrega.nombre), 'Nombre de quien entrega');
  need('s-cierre', filled(e.recibe.nombre), 'Nombre de quien recibe');
  return m;
}
function alertsOf(e, opts = {}) {
  const a = [], S = store.settings;
  const add = (sev, sec, text) => a.push({sev, sec, text});
  if (opts.stock) {
    const sum = stockSummary();
    const secOf = n => CONTROLADOS.includes(n) ? 's-controlados' : PARCHES.includes(n) ? 's-insumos' : 's-generales';
    if (sum.out.length) add('crit', secOf(sum.out[0][0]), `Reponer urgente (quedan ${critPct()}% o menos): ${sum.out.map(([n, i]) => `${n} ${Math.max(0, i.proj)} de ${i.total}`).join(', ')}`);
    if (sum.low.length) add('warn', secOf(sum.low[0][0]), `Stock bajo el mínimo: ${sum.low.map(([n, i]) => `${n} ${i.proj} de ${i.total}`).join(', ')}`);
    e.controlados.forEach(c => { const i = stockInfo(c.name), en = num(c.ent); if (i && en != null && en !== i.proj) add('warn', 's-controlados', `${c.name}: se entregan ${en} y el stock calculado es ${i.proj}`); });
  }
  const repCtrl = e.controlados.filter(c => (num(c.repo) || 0) > 0);
  if (repCtrl.length) add('info', 's-controlados', `Reposición de controlados: ${repCtrl.map(c => `${c.name} +${num(c.repo)}`).join(', ')}${filled(e.ctrlObs) ? ' (' + e.ctrlObs.trim().slice(0, 120) + ')' : ''}`);
  e.controlados.forEach(c => {
    const en = num(c.ent), re = num(c.rec), u = num(c.uso);
    if (en != null && re != null && en !== re) { const d = re - en; add('crit', 's-controlados', `${c.name}: se entregan ${en} y se reciben ${re} (diferencia ${d > 0 ? '+' : ''}${d})`); }
    if (u > 0 && !filled(c.corr)) add('warn', 's-controlados', `${c.name}: ${u} utilizado(s) sin Nº correlativo`);
  });
  const r = e.refri, mo = num(r.momento), mx = num(r.max), mn = num(r.min);
  if (mo != null && (mo < S.rMin || mo > S.rMax)) add('crit', 's-refri', `Refrigerador a ${fmtT(mo)} °C ahora, fuera del rango +${S.rMin} a +${S.rMax} °C`);
  if (mx != null && mx > S.rMax) add('warn', 's-refri', `El refrigerador llegó a ${fmtT(mx)} °C (máxima sobre ${S.rMax} °C)`);
  if (mn != null && mn < S.rMin) add('warn', 's-refri', `El refrigerador bajó a ${fmtT(mn)} °C (mínima bajo ${S.rMin} °C)`);
  ['bodega', 'salaeq'].forEach(k => {
    const c = TEMPS[k], [ta1, tb1] = tRange(k), v = tVals(e, k);

  });
  e.parches.forEach(p => { const en = num(p.ent), re = num(p.rec); if (en != null && re != null && en !== re) add('warn', 's-insumos', `${p.name}: se entregan ${en} y se reciben ${re}`); });
  Object.entries(radioOwners(e)).forEach(([r, arr]) => {
    if (arr.length < 2) return;
    const uniq = [...new Set(arr)];
    add('warn', 's-moviles', uniq.length === 1 ? `Radio ${r} está repetida en ${movName(e, uniq[0])}` : `Radio ${r} está asignada a ${uniq.map(i => movName(e, i)).join(' y ')}`);
  });
  if (e.est.siniestros === 'SI') add('warn', 's-estadistica', 'Hubo siniestros durante el turno');
  if (e.radios.cargadas === 'NO') add('warn', 's-radios', 'Radios sin cargar');

  });
  const x = e.extr;
  if (x.guardar === 'SI') add('warn', 's-extricacion', `Extricación: material pendiente de guardar${x.guardarLugar ? ' · ' + x.guardarLugar : ''}`);
  if (x.rescatar === 'SI') add('warn', 's-extricacion', `Extricación: material pendiente por rescatar${x.rescatarLugar ? ' · ' + x.rescatarLugar : ''}`);
  if (x.reponer === 'SI') add('warn', 's-extricacion', `Extricación: pendiente reponer${x.reponerDet ? ' · ' + x.reponerDet : ''}`);
  const b = e.bodega;
  if (b.limpia === 'NO') add('warn', 's-bodega', 'Bodega: sala sin limpiar u ordenar');
  if (b.reponer === 'SI') add('warn', 's-bodega', 'Bodega: pendiente reponer');
  const s = e.salaeq;
  if (s.cargando === 'NO') add('warn', 's-salaeq', 'Sala de equipos: equipos no quedaron cargando');
  if (s.limpia === 'NO') add('warn', 's-salaeq', 'Sala de equipos: sala sin limpiar u ordenar');
  const ins = e.insumos;
  if (ins.mascara === 'SI') add('info', 's-insumos', `Se usó máscara laríngea${filled(ins.mascaraN) ? ' Nº ' + ins.mascaraN : ''}: reponer`);
  const parUsed = e.parches.filter(p => (num(p.uso) || 0) > 0);
  if (parUsed.length) add('info', 's-insumos', `Parches utilizados: ${parUsed.map(p => `${p.name} ${num(p.uso)}`).join(', ')}: reponer`);
  if (ins.trocar === 'SI') add('info', 's-insumos', `Se usó trocar osteólisis${ins.trocarTipo ? ' ' + ins.trocarTipo.toLowerCase() : ''}: reponer`);
  const used = e.generales.filter(g => (num(g.uso) || 0) > 0);
  if (used.length) add('info', 's-generales', `Medicamentos utilizados: ${used.map(g => `${g.name} ${num(g.uso)}`).join(', ')}`);
  const order = {crit:0, warn:1, info:2};
  return a.sort((p, q) => order[p.sev] - order[q.sev]);
}

function refresh() {
  const e = cur(), S = store.settings;
  const miss = sectionMissing(e), al = alertsOf(e, {stock: !isRO()});

  $$('#fs [data-show]').forEach(el => { const [p, v] = el.dataset.show.split('='); el.hidden = get(e, p) !== v; });

  const critSecs = new Set(al.filter(a => a.sev === 'crit').map(a => a.sec));
  SECTIONS.forEach(([id]) => {
    const st = statusOf(id, miss, al, e);

    $$(`[data-nav="${id}"]`).forEach(n => n.dataset.st = critSecs.has(id) ? 'crit' : st.cls);
  });

  e.moviles.forEach((m, i) => {
    const el = $(`[data-movil="${i}"]`); if (!el) return;
    const any = crewAny(m);
    const miss2 = movRoles(i).filter(([k]) => !crewOk(m, k)).map(([k, c]) => filled(m[k]) ? `${c} 2º tramo` : c);
    const nr = movRadios(i) - m.radios.filter(filled).length;
    if (nr > 0) miss2.push(`${nr} radio${nr > 1 ? 's' : ''}`);
    if (!filled(m.id)) miss2.unshift('móvil');
    const st = !any ? 'empty' : miss2.length ? 'part' : 'done';
    el.dataset.st = st;
    el.querySelector('.mv-st').textContent = st === 'empty' ? 'Sin asignar' : st === 'part' ? `Falta ${miss2.join(', ')}` : 'Completo';
  });

  const prev = prevOf(e);
  e.controlados.forEach((c, i) => {
    const row = $(`[data-ctrl="${i}"]`); if (!row) return;
    const en = num(c.ent), re = num(c.rec), u = num(c.uso);
    const stEl = $(`[data-cstat="${i}"]`);
    let flag = '';
    if (en != null && re != null) {
      if (en === re) stEl.innerHTML = `<i class="ic">✓</i>Cuadra`, stEl.className = 'mstat ok';
      else { const d = re - en; stEl.innerHTML = `<i class="ic" style="background:var(--crit);color:var(--on-status)">!</i>Diferencia ${d > 0 ? '+' : ''}${d}`; stEl.className = 'mstat crit'; flag = 'crit'; }
    } else { stEl.innerHTML = `<i class="ic">·</i>Por contar`; stEl.className = 'mstat muted'; }
    if (!flag && u > 0 && !filled(c.corr)) { stEl.innerHTML = `<i class="ic" style="background:var(--warn);color:var(--on-warn)">!</i>Falta Nº correlativo`; stEl.className = 'mstat warn'; flag = 'warn'; }
    row.dataset.flag = flag;
    stockHint($(`[data-prev="${i}"]`), c.name, prev && prev.controlados.find(x => x.name === c.name));
  });
  e.parches.forEach((p, i) => {
    const row = $(`[data-par="${i}"]`); if (!row) return;
    const en = num(p.ent), re = num(p.rec), stEl = $(`[data-pstat="${i}"]`);
    let flag = '';
    if (en != null && re != null) {
      if (en === re) { stEl.innerHTML = `<i class="ic">✓</i>Cuadra`; stEl.className = 'mstat ok'; }
      else { stEl.innerHTML = `<i class="ic" style="background:var(--warn);color:var(--on-warn)">!</i>Diferencia ${re - en > 0 ? '+' : ''}${re - en}`; stEl.className = 'mstat warn'; flag = 'warn'; }
    } else { stEl.innerHTML = `<i class="ic">·</i>Por contar`; stEl.className = 'mstat muted'; }
    row.dataset.flag = flag;
    stockHint($(`[data-pprev="${i}"]`), p.name, prev && prev.parches.find(x => x.name === p.name));
  });

  applyGenFilter();

  $$('#fs [data-full]').forEach(el => { const v = String(get(e, el.dataset.full) || ''), segs = v.split('/').map(x => x.trim()).filter(Boolean); el.hidden = segs.length < 2; el.textContent = segs.length > 1 ? segs.join('  /  ') : ''; });

function inkColor() { return getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#15201a'; }
function drawSig(cv, strokes) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  const has = Array.isArray(strokes) && strokes.length > 0;
  cv.parentElement.classList.toggle('has', has);
  if (!has) return;
  const sx = w / 600, sy = h / 200;
  ctx.strokeStyle = inkColor(); ctx.fillStyle = ctx.strokeStyle;
  ctx.lineWidth = 2.4 * dpr; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  strokes.forEach(s => {
    if (s.length < 4) { ctx.beginPath(); ctx.arc(s[0] * sx, s[1] * sy, 1.6 * dpr, 0, Math.PI * 2); ctx.fill(); return; }
    ctx.beginPath(); ctx.moveTo(s[0] * sx, s[1] * sy);
    for (let i = 2; i < s.length; i += 2) ctx.lineTo(s[i] * sx, s[i+1] * sy);
    ctx.stroke();
  });
}
function setupSigs() {
  $$('canvas[data-sig]').forEach(cv => {
    const path = cv.dataset.sig;
    drawSig(cv, get(cur(), path));
    let stroke = null;
    const pos = ev => { const r = cv.getBoundingClientRect(); return [Math.round((ev.clientX - r.left) / r.width * 600), Math.round((ev.clientY - r.top) / r.height * 200)]; };
    cv.onpointerdown = ev => {
      if (isRO()) return;
      ev.preventDefault();
      try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
      stroke = pos(ev);
      let s = get(cur(), path); if (!Array.isArray(s)) { s = []; set(cur(), path, s); }
      s.push(stroke); drawSig(cv, s);
    };
    cv.onpointermove = ev => {
      if (!stroke) return;

      if (dx * dx + dy * dy < 5) return;

  });
}

function idb() { return new Promise((res, rej) => { const rq = indexedDB.open('samu-entrega-turno', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('kv'); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); }

const canPickFolder = () => !framed && typeof window.showDirectoryPicker === 'function';
async function folderPerm(ask) {

}
async function writeToFolder(name, data) { const fh = await BK.folder.getFileHandle(name, {create:true}); const w = await fh.createWritable(); await w.write(data); await w.close(); }

const scriptCfg = () => { const B = (store.settings && store.settings.backup) || {}; return {url:String(B.scriptUrl === undefined ? SCRIPT_URL_DEFAULT : (B.scriptUrl || '')).trim(), token:authToken()}; };
const scriptUrl = () => framed ? '' : scriptCfg().url;
async function scriptPost(payload) {
  const c = scriptCfg(); if (!c.url) throw {code:'script_cfg'};
  let r;
  try { r = await fetch(c.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({token:c.token}, payload)), redirect:'follow'}); }

  let j = null; try { j = JSON.parse(txt); } catch (x) {}
  if (!j) throw {code:'script_bad', detail:'HTTP ' + r.status + ': ' + txt.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 180)};
  if (!j.ok) { if (j.error === 'auth') setTimeout(authLost, 0); throw {code: j.error === 'auth' || j.error === 'token' ? 'script_token' : 'script_bad', detail:'El script respondió: ' + String(j.error || 'sin detalle').slice(0, 180)}; }
  return j;
}
async function scriptUpload(name, blob) { const j = await scriptPost({action:'save', name, mime:blob.type || 'application/octet-stream', data:await blobToBase64(blob)}); return {url:j.url || ''}; }
function blobToBase64(blob) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1] || ''); fr.onerror = () => rej(fr.error); fr.readAsDataURL(blob); }); }

/* --- Google Drive (conector de claude.ai, en la página publicada) --- */
const AUTH_CODES = ['needs_reauth','server_not_connected','selection_required','not_in_manifest','blocked_by_policy','approval_required','not_granted','capability_disabled','capability_removed','consent_required','user_changed'];
const pickId = p => (p && (p.id || (p.file && p.file.id) || (Array.isArray(p.files) && p.files[0] && p.files[0].id))) || null;
const pickUrl = p => (p && (p.viewUrl || p.webViewLink || (p.file && p.file.viewUrl))) || '';
async function driveShare(id) {
  const B = store.settings.backup, to = (B.shareWith || '').trim();
  if (!to || !id || B.sharedTo === to + '|' + id) return;
  try { await BK.mcp.callTool(DRIVE, 'share_file', {fileId:id, emailAddress:to, role:'reader'}); B.sharedTo = to + '|' + id; persist(); }
  catch (err) { if (err && AUTH_CODES.includes(err.code)) throw err; }
}
async function driveFolderId() {
  const B = store.settings.backup;
  if (B.driveFolderId) { await driveShare(B.driveFolderId); return B.driveFolderId; }
  try {
    const r = await BK.mcp.callTool(DRIVE, 'search_files', {query:`title = '${DRIVE_FOLDER}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false and owner = 'me'`, pageSize:1, excludeContentSnippets:true}, {cache:false});
    const f = r.payload && Array.isArray(r.payload.files) ? r.payload.files[0] : null;
    if (f && f.id) { B.driveFolderId = f.id; B.driveFolderUrl = f.viewUrl || ''; persist(); await driveShare(f.id); return f.id; }
  } catch (err) { if (err && AUTH_CODES.includes(err.code)) throw err; }
  try {
    const r = await BK.mcp.callTool(DRIVE, 'create_file', {title:DRIVE_FOLDER, contentMimeType:'application/vnd.google-apps.folder'});
    const id = pickId(r.payload);
    if (id) { B.driveFolderId = id; B.driveFolderUrl = pickUrl(r.payload); persist(); await driveShare(id); return id; }
  } catch (err) { if (err && AUTH_CODES.includes(err.code)) throw err; }
  return null;
}
async function driveUpload(name, blob) {
  const parentId = await driveFolderId();
  const input = {title:name, base64Content: await blobToBase64(blob), contentMimeType:'application/pdf', disableConversionToGoogleType:true};
  if (parentId) input.parentId = parentId;
  try { const r = await BK.mcp.callTool(DRIVE, 'create_file', input); return {url:pickUrl(r.payload)}; }
  catch (err) {
    if (err && err.code === 'tool_error' && parentId) { store.settings.backup.driveFolderId = null; delete input.parentId; const r = await BK.mcp.callTool(DRIVE, 'create_file', input); return {url:pickUrl(r.payload)}; }
    throw err;
  }
}

    case 'perm': return 'Falta permiso para escribir en la carpeta de respaldo. Toca Respaldar ahora y acepta.';

async function backupEntry(e) {
  const mode = backupMode(), name = pdfName(e), at = new Date().toISOString();
  const blob = await buildPdf(e);
  if (mode === 'folder') {
    if (!(await folderPerm(false))) throw {code:'perm'};
    await writeToFolder(name, blob);
    try { await writeToFolder('respaldo-datos-entrega-turno.json', JSON.stringify(store)); } catch (x) {}
    e.backup = {at, where:'folder', place:BK.folderName, name};
  } else if (mode === 'script') {
    const r = await scriptUpload(name, blob);
    try { await scriptUpload('respaldo-datos-entrega-turno.json', new Blob([JSON.stringify(store)], {type:'application/json'})); } catch (x) {}
    e.backup = {at, where:'drive', place:'Google Drive', name, url:r.url};
  } else if (mode === 'drive') {
    const r = await driveUpload(name, blob);
    e.backup = {at, where:'drive', place:DRIVE_FOLDER, name, url:r.url};
  } else if (mode === 'download') {
    downloadBlob(name, blob); e.backup = {at, where:'download', name};
  } else if (mode === 'save') {

}

function importBackup(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const obj = JSON.parse(rd.result);
      if (!obj || !Array.isArray(obj.history)) throw new Error('formato');
      const ids = new Set(store.history.map(h => h.id)); let added = 0;
      obj.history.forEach(h => { if (h && h.id && !ids.has(h.id)) { store.history.push(normalize(h)); added++; } });
      if (obj.settings) {
        const os = obj.settings;
        if (os.nextNum) store.settings.nextNum = Math.max(store.settings.nextNum, os.nextNum);
        ['rMin','rMax','nRadios','stockCrit'].forEach(k => { if (os[k] != null) store.settings[k] = os[k]; });
        if (Array.isArray(os.personal) && os.personal.length) store.settings.personal = os.personal;
        if (Array.isArray(os.flota) && os.flota.length) store.settings.flota = os.flota;
        if (os.backup && os.backup.shareWith !== undefined) store.settings.backup = Object.assign(store.settings.backup || {}, {shareWith:os.backup.shareWith});
      }
      if (obj.stock && obj.stock.items) {
        if (!store.stock.movs.length) store.stock = obj.stock; else { const mids = new Set(store.stock.movs.map(m => m.id)); (obj.stock.movs || []).forEach(m => { if (m && m.id && !mids.has(m.id)) store.stock.movs.push(m); }); Object.keys(obj.stock.items).forEach(n => { if (!store.stock.items[n] || num(store.stock.items[n].total) == null) store.stock.items[n] = obj.stock.items[n]; }); }
        ensureStock();
      }
      if (Array.isArray(obj.recuentos)) { const rids = new Set(store.recuentos.map(r => r.id)); obj.recuentos.forEach(r => { if (r && r.id && !rids.has(r.id)) store.recuentos.push(r); }); store.recuentos.sort((a, b) => String(b.at).localeCompare(String(a.at))); }
      sortHistory(); persist(); closeSheet(); renderAll();
      toast(`Respaldo importado: ${added} entrega${added !== 1 ? 's' : ''} nueva${added !== 1 ? 's' : ''}, con nómina, móviles y stock`);
    } catch (e) { toast('El archivo no es un respaldo válido de esta planilla'); }
  };
  rd.readAsText(file);
}

/* ================== entrega en línea (varios computadores por el script de Google) ==================

    const next = sapply(clone(SY.base), sdiff(sent, now, [], []), null);
    if (!jeq(next, now)) adoptSync(next);
    syncMeta(true); SY.last = new Date(); SY.err = '';
  } catch (e) {
    SY.err = e && e.code === 'auth' ? 'La sesión venció: vuelve a entrar'
      : e && e.code === 'old' ? 'El script de Google es la versión anterior: falta actualizarlo para la entrega en línea'
      : e && e.code === 'net' ? 'Sin conexión: los cambios quedan en este computador y se envían al volver internet'
      : 'El script de Google no respondió bien' + (e && e.detail ? ': ' + e.detail : '');
    if (e && (e.code === 'old' || e.code === 'auth')) { SY.noScript = true; }
  } finally {
    SY.busy = false; syncPaint();
    if (SY.again) { SY.again = false; syncSoon(); }
  }
}
async function syncNow() { for (let i = 0; i < 60 && SY.busy; i++) await new Promise(r => setTimeout(r, 250)); await syncCycle(); }
function syncSoon() { if (!SY.started || SY.adopting) return; SY.act = Date.now(); clearTimeout(SY.soonT); SY.soonT = setTimeout(syncCycle, 700); }
function syncStart() {
  if (SY.started || !syncOn()) { syncPaint(); return; }
  SY.started = true; SY.act = Date.now(); syncCycle();
  /* cada 3 s si hay movimiento, cada 12 s si está tranquilo */
  SY.tick = setInterval(() => { SY.n++; if (document.hidden && SY.n % 4) return; if (Date.now() - SY.act < 120000 || SY.n % 4 === 0) syncCycle(); }, 3000);
}
function syncStop() { SY.started = false; clearInterval(SY.tick); clearTimeout(SY.soonT); syncPaint(); }
function syncInfoText() {
  if (framed) return '';
  if (!scriptUrl()) return 'Para usarla, pega el enlace del script de Google más arriba.';
  if ((store.settings.backup || {}).sync === false) return 'Desactivada: este computador trabaja solo.';
  if (SY.err) return SY.err + '.';
  return SY.last ? `En línea. Última sincronización ${pad(SY.last.getHours())}:${pad(SY.last.getMinutes())}:${pad(SY.last.getSeconds())}.` : 'Conectando…';
}
function syncPaint() {
  const el = $('#syncState'); if (!el) return;
  const info = $('#syncInfo'); if (info) info.textContent = syncInfoText();
  if (framed || !scriptUrl() || (store.settings.backup || {}).sync === false) { el.hidden = true; return; }
  el.hidden = false;
  if (SY.err) { el.dataset.st = 'off'; el.textContent = SY.noScript ? '● Falta actualizar el script' : '● Sin conexión'; el.title = SY.err; }
  else if (SY.last) { el.dataset.st = 'on'; el.textContent = '● En línea'; el.title = 'Sincronizado con los otros computadores'; }
  else { el.dataset.st = ''; el.textContent = '● Conectando…'; el.title = ''; }
}

/* el TV de otro computador también lee directo de Google */
const TVSY = {rev:0, live:null, hist:{}, busy:false};
async function tvPull() {
  if (!syncOn() || TVSY.busy) return false;
  if (!authToken()) return false;
  TVSY.busy = true;
  try {
    const r = await syncPost({action:'pull', since:TVSY.rev});
    if (r.rev === TVSY.rev) return false;
    if (r.live) TVSY.live = r.live;
    (r.hist || []).forEach(h => { if (h._del) delete TVSY.hist[h.id]; else TVSY.hist[h.id] = h; });
    TVSY.rev = r.rev;
    const L = TVSY.live; if (!L) return false;
    if (L.settings) Object.assign(store.settings, clone(L.settings));
    store.draft = L.draft ? migrateDraft(normalize(clone(L.draft))) : blankEntry();
    if (L.stock) store.stock = clone(L.stock);
    store.history = Object.values(TVSY.hist).map(h => normalize(clone(h)));
    ensureStock(); sortHistory(); tvSeen = new Date();
    return true;
  } catch (e) { if (e && e.code === 'auth') { try { localStorage.removeItem(TV_KEY); } catch (x) {} tvActPaint(); } return false; }
  finally { TVSY.busy = false; }
}
function tvActPaint() {
  const box = document.getElementById('tvAct'); if (!box) return;
  box.hidden = !!(tvToken() || testToken());
}
async function tvActivate() {
  const code = (document.getElementById('tvCode').value || '').replace(/[\s·-]/g, '').toUpperCase(), pin = document.getElementById('tvPin').value || '', err = document.getElementById('tvActErr');
  if (!code || !pin) { err.textContent = 'Escribe código y clave de la jefatura.'; return false; }
  err.textContent = 'Verificando…';
  try {
    const j = await loginCall(code, pin, 'tv');
    if (!j.ok) { err.textContent = LOGIN_ERR[j.error] || 'No se pudo activar.'; return false; }
    localStorage.setItem(TV_KEY, j.token); err.textContent = ''; document.getElementById('tvPin').value = '';
    tvActPaint(); window.dispatchEvent(new Event('resize')); TVSY.rev = 0; tvPull().then(ch => { if (ch) tvRender(); });
    return true;
  } catch (e) { err.textContent = 'Sin conexión con Google.'; return false; }
}

let tvRaw = null, tvSeen = null;
function tvLoad() {
  let raw = null;

    store.settings = Object.assign(defaultSettings(), s.settings || {});
    if (!Array.isArray(store.settings.personal) || !store.settings.personal.length) store.settings.personal = defaultSettings().personal;
    store.history = Array.isArray(s.history) ? s.history.map(normalize).filter(h => !h.ejemplo) : [];
    store.draft = s.draft ? migrateDraft(normalize(s.draft)) : blankEntry();
    store.stock = s.stock || null; store.recuentos = Array.isArray(s.recuentos) ? s.recuentos : [];

function tvShort(v) {
  if (!filled(v)) return '';
  const m = String(v).match(/^\s*([A-Za-z]{1,3}\d{1,3})\s*·\s*(.+)$/);
  if (!m) return String(v).trim().toUpperCase();
  const w = m[2].trim().split(/\s+/), pre = ['san','de','del','la','las','los','van','von','le','da','di','mc','mac'];
  let out = w[0], i = 1;
  while (i < w.length && pre.includes(w[i - 1].toLowerCase())) { out += ' ' + w[i]; i++; }
  return m[1].toUpperCase() + ' · ' + out.toUpperCase();
}
/* ¿la entrega en curso ya tiene algo escrito? (cualquier campo cuenta) */
const TV_SKIP = new Set(['id','fecha','name','numero','ejemplo','savedAt','extra']);
function tvAny(v, k) {
  if (TV_SKIP.has(k) || v == null) return false;
  if (Array.isArray(v)) return v.some(x => tvAny(x));
  if (typeof v === 'object') return Object.keys(v).some(kk => tvAny(v[kk], kk));
  if (typeof v === 'boolean') return v;
  return String(v).trim() !== '';
}
function tvEntry() {
  const d = store.draft;

  const h = store.history[0];
  return h ? {e:h, live:false} : {e:d, live:true};
}
function tvMovName(m, i) { if (!filled(m.id)) return `Móvil ${i + 1}`; const n = String(m.id).match(/(\d+)\s*$/); return n ? `Móvil ${n[1]}` : m.id; }

    if (!isSplit(m, k)) return `<div class="tv-rl">${lbl}</div><div class="tv-rv${filled(m[k]) ? '' : ' miss'}">${one(m[k])}</div>`;
    const [ini, fin] = turnoHoras(e), h = splitHora(e, m, k), cm = toM(h);

    const ln = (v, a, b, on) => `<div class="tv-rv sp${filled(v) ? '' : ' miss'}${on === false ? ' off' : ''}"><i>${hh(a)}–${hh(b)}</i>${one(v)}</div>`;
    return `<div class="tv-rl">${lbl} · turno dividido</div>${ln(m[k], ini, h, firstNow === null ? null : firstNow)}${ln(m[k + '2'], h, fin, firstNow === null ? null : !firstNow)}`;
  };

  /* novedades ordenadas por gravedad (rojo, amarillo, verde); de los avisos automáticos solo los críticos, sin radios ni oxígeno */
  const TV_SKIP = new Set(['s-radios', 's-oxigeno', 's-moviles']);

  const rows = [];
  jefItems(e).forEach(j => rows.push({k:sevRank(j.sev), at:String(j.at || ''), html:nvRow(SEV_NAME[j.sev] ? 'sev-' + j.sev : 'jef', 'Jefatura' + (jefHora(j) ? ' ' + jefHora(j) : ''), j.txt)}));

  rows.sort((a, b) => a.k - b.k || (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
  const items = rows.map(r => r.html);

  const temps = ['refri','bodega','salaeq'].map(k => {
    const v = tVals(e, k), st = tState(e, k), [a, b] = tRange(k);

    return `<div class="tv-li"><div><b>${nm}</b><small>${rTxt(a, b)}${v.mx != null || v.mn != null ? `<br>máx ${fmtT(v.mx)} · mín ${fmtT(v.mn)}` : ''}</small></div><div class="tv-tr"><b>${v.mo != null ? fmtT(v.mo) + ' °C' : '—'}</b>${pill}</div></div>`;
  }).join('');

  let stockHtml = '', stockCount = '';
  if (live) {
    const sm = stockSummary(), list = sm.out.map(x => [x, 'crit']).concat(sm.low.map(x => [x, 'warn']));
    stockCount = sm.tracked ? (list.length ? `${list.length} por reponer` : '') : '';
    stockHtml = !sm.tracked ? '<p class="tv-none">Sin totales cargados en Stock.</p>'

        + (list.length > 5 ? `<p class="tv-none">y ${list.length - 5} más</p>` : '');
  } else stockHtml = '<p class="tv-none">Se muestra al empezar la próxima entrega.</p>';

  const resv = (store.settings.flota || []).filter(f => filled(f.num) && e.reserva && e.reserva[f.num] === 'Disponible' && !e.moviles.some(m => m.id === flotaLabel(f)));
  const resHtml = resv.length ? resv.slice(0, 5).map(f => `<div class="tv-li"><b>Móvil ${esc(f.num)}</b><span class="tv-pill ok">Disponible</span></div>`).join('')

function tvFit() {

function startTV() {

  document.getElementById('app').hidden = true;
  const host = document.createElement('div');

  window.addEventListener('resize', tvFit);
  window.addEventListener('storage', ev => { if (ev.key === LS_KEY && tvLoad()) tvRender(); });

  tvPull().then(ch => { if (ch) tvRender(); });
  setInterval(() => {
    if (tvLoad()) tvRender();
    /* si el dashboard se abrió con una versión nueva del archivo, el TV se recarga solo */
    let v = null; try { v = localStorage.getItem(VER_KEY); } catch (e) {}
    if (v && v !== APP_VER) { let done = null; try { done = sessionStorage.getItem(VER_KEY); } catch (e) {} if (done !== v) { try { sessionStorage.setItem(VER_KEY, v); } catch (e) {} location.reload(); } }
  }, 1000);
  let lastMin = hhmm();
  setInterval(() => { const c = document.getElementById('tvClock'), t = hhmm(); if (c) c.textContent = t; if (t !== lastMin) { lastMin = t; tvRender(); } }, 1000);
  /* ---- pantalla completa y pantalla siempre encendida ---- */
  const kiosk = () => Math.abs(window.innerHeight - screen.height) < 4 && Math.abs(window.innerWidth - screen.width) < 4;
  const isFs = () => !!document.fullscreenElement || kiosk();
  let wl = null;
  const awake = async () => {
    if (wl || document.visibilityState !== 'visible' || !('wakeLock' in navigator)) return;
    try { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; paintFs(); }); } catch (e) { wl = null; }

  };

    const fs = isFs();

  document.addEventListener('visibilitychange', awake);
  window.addEventListener('resize', paintFs);
  setInterval(awake, 20000);
  awake(); paintFs();
  let curT = null;
  const showHint = () => { const h = document.getElementById('tvHint'); h.style.opacity = '1'; host.classList.remove('nocur'); clearTimeout(curT); curT = setTimeout(() => { host.classList.add('nocur'); h.style.opacity = '0'; document.getElementById('tvFsBtn').classList.add('hide'); }, 4000); document.getElementById('tvFsBtn').classList.remove('hide'); };
  host.addEventListener('mousemove', showHint); showHint();
}
